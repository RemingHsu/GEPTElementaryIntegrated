<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GEPT 初級單字 v2.0</title>
<style>
:root{
  --bg:#fafaf7; --paper:#fff; --ink:#1a1a1a; --ink-2:#3a3a37;
  --muted:#8a8a85; --rule:#e6e4dc;
  --accent:oklch(0.55 0.12 35); --green:oklch(0.55 0.12 145);
  --yellow:oklch(0.78 0.14 90); --red:oklch(0.58 0.16 25);
  --fs:16px;
}
[data-theme="dark"]{--bg:#16161a;--paper:#1e1e22;--ink:#ececec;--ink-2:#c8c8c8;--muted:#8a8a90;--rule:#2e2e34;
  --accent:oklch(0.72 0.12 35);--green:oklch(0.72 0.12 145);--yellow:oklch(0.85 0.14 90);--red:oklch(0.72 0.16 25);}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:ui-serif,"Iowan Old Style","Noto Serif TC",Georgia,serif;font-size:var(--fs);line-height:1.55;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--rule);padding:14px 24px 10px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:600}
h1 .sub{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px;font-family:ui-sans-serif,system-ui,sans-serif}
input.search{flex:1;min-width:220px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:9px 14px;color:var(--ink);font:inherit;font-size:15px;font-family:ui-sans-serif,system-ui,sans-serif}
.tools{display:flex;gap:6px;align-items:center;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px}
.btn{background:transparent;color:var(--ink-2);border:1px solid var(--rule);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* tabs: 3 行堆疊 (meta / main / supp) */
.tabs-wrap{position:sticky;top:62px;z-index:49;background:var(--bg);border-bottom:1px solid var(--rule)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 16px;background:var(--bg);font-family:ui-sans-serif,system-ui,sans-serif;scrollbar-width:thin}
nav.tabs-meta{background:color-mix(in oklch,var(--paper) 60%,var(--bg));border-bottom:1px solid var(--rule)}
nav.tabs-supp{background:color-mix(in oklch,var(--paper) 35%,var(--bg));border-top:1px dashed var(--rule)}
nav.tabs-supp .tab{font-size:13px;color:color-mix(in oklch,var(--muted) 80%,var(--ink))}
.tab{flex-shrink:0;padding:10px 14px;cursor:pointer;color:var(--muted);border:none;background:transparent;border-bottom:2px solid transparent;white-space:nowrap;font-size:14px;font-family:inherit}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .ct{color:var(--muted);font-size:11px;margin-left:4px}
.tab .mm-mark{display:inline-block;margin-left:5px;font-size:10px;opacity:.55;vertical-align:1px;transition:opacity .12s ease}
.tab:hover .mm-mark,.tab.active .mm-mark{opacity:1}
main{padding:20px 28px 80px;max-width:1400px;margin:0 auto}
.theme-h{font-size:24px;margin:0 0 4px;font-weight:600}
.theme-meta{color:var(--muted);font-size:13px;margin-bottom:16px;font-family:ui-sans-serif,system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;position:relative}
.card.known{border-color:var(--green)}
.card.unfam{border-color:var(--red)}
.w-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word{font-size:22px;font-weight:600;font-family:"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
.pos{display:inline-block;font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--rule);color:var(--ink-2);font-family:ui-monospace,Menlo,monospace}
.zh{color:var(--ink-2);margin:6px 0 8px;font-size:15px}
.ex{font-size:14px;border-top:1px dashed var(--rule);padding-top:8px}
.ex .en{color:var(--ink);display:block}
.ex .tc{color:var(--muted);font-size:13px}
.actions{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.icon-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-size:13px;color:var(--muted)}
.icon-btn.on-known{color:var(--green);border-color:var(--green)}
.icon-btn.on-unfam{color:var(--red);border-color:var(--red)}
.legend{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px 22px;margin-bottom:18px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px}
.legend h2{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:500}
.legend table{width:100%;border-collapse:collapse}
.legend td{padding:6px 8px;border-bottom:1px dashed var(--rule);font-size:13.5px}
.flash{width:min(640px,92vw);aspect-ratio:16/10;background:var(--paper);border:1px solid var(--rule);border-radius:20px;display:grid;place-items:center;padding:32px;cursor:pointer;text-align:center;margin:20px auto}
.flash .big{font-size:54px;font-weight:600;font-family:"SF Pro Display",Helvetica,sans-serif}
.flash .meaning{font-size:28px;color:var(--ink-2)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.progress-pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted)}
.progress-pill .bar{width:60px;height:4px;background:var(--rule);border-radius:99px;overflow:hidden}
.progress-pill .bar i{display:block;height:100%;background:var(--green);width:0}
.notice{background:color-mix(in oklch,var(--yellow) 18%,var(--paper));border:1px solid color-mix(in oklch,var(--yellow) 50%,var(--rule));border-radius:12px;padding:14px 18px;margin-bottom:16px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13.5px;line-height:1.6}
mark{background:color-mix(in oklch,var(--yellow) 60%,transparent);padding:0 2px;border-radius:2px}
.voice-panel{margin-top:10px;padding:12px 16px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px}
.voice-panel .vp-row{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.voice-panel label{min-width:36px;color:var(--muted)}
.voice-panel select{background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;font:inherit;flex:1;min-width:200px;max-width:420px}
.voice-panel input[type=range]{flex:1;max-width:240px}
.voice-panel .vp-val{font-family:ui-monospace,monospace;color:var(--muted);min-width:40px}
.voice-panel .vp-hint{color:var(--muted);font-size:12px}
.btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ===== v1.1: 心智圖 ===== */
.mindmap{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 16px 16px;margin:0 0 18px;font-family:ui-sans-serif,system-ui,sans-serif}
.mindmap .mm-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.mindmap .mm-title{font-weight:600;color:var(--ink-2);font-size:14px}
.mindmap .mm-spacer{flex:1}
.mindmap .mm-dots{display:flex;gap:6px}
.mindmap .mm-dot{width:8px;height:8px;border-radius:50%;background:var(--rule);border:none;cursor:pointer;padding:0}
.mindmap .mm-dot.on{background:var(--accent)}
.mindmap .mm-counter{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);min-width:34px;text-align:center}
.mindmap .mm-iconbtn{width:28px;height:28px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);cursor:pointer;color:var(--ink-2);font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.mindmap .mm-iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.mindmap .mm-img-wrap{position:relative;background:color-mix(in oklch,var(--rule) 35%,var(--paper));border-radius:10px;overflow:hidden;text-align:center}
.mindmap .mm-img-wrap img{display:block;max-width:100%;width:auto;max-height:480px;margin:0 auto;cursor:zoom-in;background:#fff}
.mindmap .mm-img-wrap .mm-fail{padding:34px 20px;color:var(--muted);font-size:13px}
/* v2.3: 分類↔心智圖對照表 */
.mapping-card,.main-mm-card{background:color-mix(in oklch,var(--accent) 7%,var(--paper));border:1px solid color-mix(in oklch,var(--accent) 28%,var(--rule));border-radius:14px;padding:18px 22px;margin-bottom:20px;font-family:ui-sans-serif,system-ui,sans-serif}
.mapping-card h2,.main-mm-card h2{margin:0 0 4px;font-size:18px;color:var(--ink);font-weight:700}
.mapping-card .mapping-sub,.main-mm-card .mapping-sub{margin:6px 0 14px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.mapping-card .mapping-foot{margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.mapping-table-wrap{background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow-x:auto;max-height:54vh;overflow-y:auto}
.mapping-table{width:100%;border-collapse:collapse;font-size:13.5px}
.mapping-table thead th{position:sticky;top:0;background:var(--paper);border-bottom:1.5px solid var(--rule);text-align:left;padding:9px 12px;font-weight:600;color:var(--ink-2);font-size:12.5px;letter-spacing:.3px}
.mapping-table tbody td{padding:7px 12px;border-bottom:1px solid color-mix(in oklch,var(--rule) 60%,var(--paper))}
.mapping-table tbody tr:hover{background:color-mix(in oklch,var(--accent) 5%,var(--paper))}
.mapping-table tbody td:first-child{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;width:36px;text-align:center}
.mapping-table .mm-pill{display:inline-block;padding:2px 8px;border-radius:99px;background:color-mix(in oklch,var(--accent) 14%,var(--paper));border:1px solid color-mix(in oklch,var(--accent) 35%,var(--rule));font-size:12.5px;color:var(--ink)}
/* v2.4 心智圖圖片區 */
.mm-img-box{background:color-mix(in oklch,var(--paper) 70%,var(--bg));border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mm-img-box img{max-width:100%;width:100%;height:auto;display:block;cursor:zoom-in;border-radius:4px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.mm-img-box .mm-img-hint{font-size:11.5px;color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif}
.mm-img-box .mm-img-hint.hidden{display:none}
.mm-img-zoom img{max-width:96vw;max-height:88vh;width:auto;background:#fff;border-radius:6px;cursor:zoom-out}
.mm-tree-wrap.mm-fallback{background:color-mix(in oklch,var(--paper) 70%,var(--bg));border-radius:8px;padding:14px 18px}
/* v2.0 樹狀心智圖 */
.mindmap .mm-tree-wrap{padding:14px 18px;background:color-mix(in oklch,var(--paper) 70%,var(--bg));border-radius:10px;max-height:60vh;overflow:auto}
.mindmap .mm-root,.mm-tree-modal .mm-root{font-size:15px;font-weight:700;padding:6px 12px;background:var(--accent);color:#fff;border-radius:8px;display:inline-block;margin-bottom:10px}
.mm-tree{list-style:none;padding-left:18px;margin:2px 0 0;border-left:1px solid var(--rule)}
.mm-tree li{margin:3px 0;position:relative}
.mm-tree li::before{content:"";position:absolute;left:-18px;top:11px;width:14px;height:1px;background:var(--rule)}
.mm-tree .mm-node{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--rule);font-size:13px;line-height:1.5}
.mm-tree .mm-l1 > .mm-node{font-weight:600;font-size:14px;background:color-mix(in oklch,var(--accent) 12%,var(--paper));border-color:color-mix(in oklch,var(--accent) 35%,var(--rule))}
.mm-tree .mm-l2 > .mm-node{background:color-mix(in oklch,var(--accent) 5%,var(--paper))}
.mm-tree .mm-l3 > .mm-node{background:transparent;border-color:transparent;color:var(--muted);font-size:12.5px}
.mm-tree-modal{background:#fff;color:#000;padding:24px 28px;border-radius:12px;max-width:88vw;max-height:78vh;overflow:auto;font-family:ui-sans-serif,system-ui,sans-serif}
.mm-tree-modal .mm-root{background:#1f1f1f;color:#fff}
.mm-tree-modal .mm-tree .mm-node{background:#f5f5f5;border-color:#ddd}
.mm-tree-modal .mm-tree .mm-l1 > .mm-node{background:#ffe9d4;border-color:#f5c79a}
.mm-tree-modal .mm-tree .mm-l2 > .mm-node{background:#fff5e9}
.mm-tree-modal .mm-tree .mm-l3 > .mm-node{background:transparent;border-color:transparent;color:#666}
.mindmap.collapsed .mm-body{display:none}
.mindmap.collapsed{padding:10px 16px}

/* full-screen zoom modal */
.mm-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:12px}
.mm-modal img{max-width:100%;max-height:88vh;background:#fff;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.mm-modal .mm-mbar{display:flex;gap:10px;align-items:center;color:#fff;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px}
.mm-modal .mm-mbar .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}

/* ===== v1.1: 口袋單字選取 UI ===== */
.pocket-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px}
.pocket-bar .pb-count{color:var(--muted)}
.pocket-bar .pb-spacer{flex:1}
.card .pocket-mark{position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;color:var(--accent);padding:0}
body[data-selecting="1"] .card .pocket-mark{display:inline-flex}
body[data-selecting="1"] .card{padding-left:42px}
.card .pocket-mark.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card .pocket-pin{position:absolute;bottom:8px;right:10px;background:transparent;border:1px solid transparent;cursor:pointer;color:var(--muted);font-size:14px;padding:4px 10px;border-radius:999px;line-height:1;transition:all .12s ease;display:inline-flex;align-items:center;gap:4px;font-family:ui-sans-serif,system-ui,sans-serif}
.card .pocket-pin::before{content:"📌";filter:grayscale(1) opacity(.5)}
.card .pocket-pin:hover{background:var(--rule);color:var(--ink-2)}
.card .pocket-pin:hover::before{filter:none}
.card .pocket-pin.on{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:inset 0 1px 3px rgba(0,0,0,.28),0 0 0 2px color-mix(in oklch,var(--accent) 25%,transparent);transform:scale(.95);font-weight:500}
.card .pocket-pin.on::before{content:"✔";filter:none;font-size:12px}
.card .pocket-pin.on::after{content:"在口袋";font-size:11px}
.card.in-pocket{box-shadow:0 0 0 2px color-mix(in oklch,var(--accent) 35%,transparent) inset}
.star-tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:10px;font-family:ui-sans-serif,system-ui;font-weight:600;vertical-align:2px;letter-spacing:.5px}
.star-tag.s5{background:color-mix(in oklch,var(--accent) 92%,#fff);color:#fff}
.star-tag.s4{background:color-mix(in oklch,var(--accent) 18%,var(--paper));color:var(--accent);border:1px solid color-mix(in oklch,var(--accent) 40%,var(--rule))}
.card.has-s5{box-shadow:inset 3px 0 0 var(--accent)}
.card.has-s4{box-shadow:inset 3px 0 0 color-mix(in oklch,var(--accent) 60%,var(--rule))}
.card.has-s5.in-pocket,.card.has-s4.in-pocket{box-shadow:inset 3px 0 0 var(--accent), 0 0 0 2px color-mix(in oklch,var(--accent) 35%,transparent) inset}
.legend-stars{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.5px}


/* ===== v1.1: 心智圖對照編輯器 ===== */
.mm-editor{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px 22px;margin-bottom:18px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13.5px}
.mm-editor h2{margin:0 0 4px;font-size:15px;color:var(--ink-2);font-weight:600}
.mm-editor .mme-sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.mm-editor .mme-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--rule)}
.mm-editor .mme-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;padding-right:4px}
.mm-editor .mme-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--bg)}
.mm-editor .mme-row:hover{border-color:color-mix(in oklch,var(--accent) 40%,var(--rule))}
.mm-editor .mme-name{flex:1;font-size:13.5px}
.mm-editor .mme-chips{display:flex;gap:4px;flex-wrap:wrap;color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,monospace}
.mm-editor .mme-chip{background:var(--rule);padding:1px 6px;border-radius:99px}
.mm-editor .mme-empty{color:var(--muted);font-style:italic;font-size:11.5px}
.mm-editor .mme-count{font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:11.5px;min-width:32px;text-align:right}
.mm-editor .mme-customized{border-left:3px solid var(--accent)}
.mm-editor .btn-small{padding:4px 8px;font-size:12px}

/* 編輯對話框 */
.mme-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;font-family:ui-sans-serif,system-ui,sans-serif}
.mme-modal .mme-box{background:var(--paper);color:var(--ink);border-radius:14px;padding:20px 22px;width:min(720px,96vw);max-height:88vh;display:flex;flex-direction:column}
.mme-modal .mme-box h3{margin:0 0 6px;font-size:17px}
.mme-modal .mme-box .mme-hint{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.mme-modal .mme-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;padding:4px 4px 12px}
.mme-modal .mme-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;cursor:pointer;background:var(--bg)}
.mme-modal .mme-opt:hover{border-color:color-mix(in oklch,var(--accent) 50%,var(--rule))}
.mme-modal .mme-opt.on{border-color:var(--accent);background:color-mix(in oklch,var(--accent) 10%,var(--paper))}
.mme-modal .mme-opt .mme-thumb{width:48px;height:36px;background:#eee;border-radius:4px;flex-shrink:0;object-fit:cover;background-image:repeating-linear-gradient(45deg,#e8e8e8 0 4px,#f4f4f4 4px 8px)}
.mme-modal .mme-opt .mme-slug{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-2);word-break:break-all;line-height:1.35}
.mme-modal .mme-foot{display:flex;gap:8px;align-items:center;border-top:1px solid var(--rule);padding-top:12px;margin-top:8px}
.mme-modal .mme-foot .sp{flex:1}

/* ===== v1.1: 口袋單字 / 列印版 ===== */
.pocket-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13.5px}
.print-sheet{background:#fff;color:#000;padding:8mm 8mm;border:1px solid var(--rule);border-radius:8px;font-family:ui-serif,"Iowan Old Style","Noto Serif TC",Georgia,serif}
.print-sheet h2{margin:0 0 6mm;font-size:18px;border-bottom:1px solid #999;padding-bottom:3mm}
.print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.print-card{border:1px solid #bbb;border-radius:4px;padding:2.2mm 3mm;page-break-inside:avoid;background:#fff}
.print-card .pc-w{font-size:12.5pt;font-weight:600;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.2}
.print-card .pc-pos{display:inline-block;font-size:7pt;padding:0 3px;border:1px solid #999;border-radius:3px;margin-left:4px;font-family:ui-monospace,Menlo,monospace;color:#444;vertical-align:1px}
.print-card .pc-zh{margin:1mm 0 1.2mm;font-size:9.5pt;color:#222;line-height:1.35}

<script>
// ============ 詞類縮寫對照 ============
const POS_LEGEND = [

  ["conj.","conjunction","連接詞"],["aux.","auxiliary verb","助動詞"],
  ["art.","article","冠詞"],["det.","determiner","限定詞"],

];

// ============ 單字資料 ============
// 全部資料載入自 data/vocab.js (44 分類，~2,216 字，含星等)

const VOCAB = window.VOCAB;

// ============ v2.0: 心智圖系統 ============
// 心智圖樹狀資料載入自 data/mindmaps.js (window.MINDMAPS)
const MINDMAPS_ALL = window.MINDMAPS || [];

// 分類名稱 → 適用心智圖的 index 陣列
// 心智圖 index: 0=主架構 1=身分職業 2=家庭人際 3=情緒個性 4=身體健康 5=食物飲食

};

function getMindmaps(name){
  if(state.mmOverride && Array.isArray(state.mmOverride[name])){
    // 防衛：舊版可能存字串 slug；只保留有效的整數 index
    const valid = state.mmOverride[name].filter(i=> typeof i === "number" && MINDMAPS_ALL[i]);
    if(valid.length) return valid;
  }
  return MINDMAP_FOR_CATEGORY[name] || [];
}

// ============ 應用程式 ============
const STORE_KEY = "gept_v1";
let state = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
state.known = state.known || {};
state.unfam = state.unfam || {};
state.pocket = state.pocket || {};                      // v1.1
state.flashMode = state.flashMode || "未標會";          // v1.1: 全部/已會/未標會/不熟
state.mmOverride = state.mmOverride || {};              // v1.1: 使用者自訂心智圖對照
state.selecting = false;                                // v1.1: 選取模式 (不持久)
state.tab = state.tab || Object.keys(VOCAB)[0];
state.fs = state.fs || 16;
state.theme = state.theme || "light";

// ===== v1.2 migration: 「💼 身分與職業」 + 「💼 職業」 → 「💼 職業」 =====
function migrateCategoryName(oldName, newName){
  let migrated = false;
  if(state.tab === oldName){ state.tab = newName; migrated = true; }
  if(state.mmOverride && state.mmOverride[oldName] !== undefined){
    if(state.mmOverride[newName] === undefined) state.mmOverride[newName] = state.mmOverride[oldName];
    delete state.mmOverride[oldName]; migrated = true;
  }
  for(const prefix of ["mm_idx_","mm_collapsed_","mm_expanded_"]){
    const oldKey = prefix + oldName;
    const newKey = prefix + newName;
    if(state[oldKey] !== undefined){
      if(state[newKey] === undefined) state[newKey] = state[oldKey];
      delete state[oldKey]; migrated = true;
    }
  }
  return migrated;
}
// ===== v2.0 migration: 舊版分類名稱 → 新版 =====
const V2_RENAME = {
  "💼 職業": "💼 身分與職業",
  "🩺 健康與醫療": "🏥 健康與醫療",
  "💉 健康與醫療": "🏥 健康與醫療",
  "🥤 飲料": "☕ 飲料",
  "🌳 自然與植物": "🌳 植物與自然景觀",
  "🌤️ 天氣與季節": "🌤️ 天氣與氣候",
  "🏠 居家、家具與家用品": "🏠 家中物品與房間",
  "🏙️ 城市與場所": "🏙️ 城市與建築",
  "🚌 交通工具": "🚗 交通工具",
  "👕 衣物與配件": "👕 衣物配件",
  "🎨 顏色與形狀": "🎨 顏色與外觀",
  "🕐 時間": "⏰ 時間單位",
  "📅 月份、星期、節日": "📅 星期與月份",
  "💭 心智與思考": "🧠 心智活動",
  "💬 溝通與媒體": "💬 溝通動詞",
  "🌐 抽象與其他": "💡 抽象名詞",
  "✨ 形容詞與副詞": "✨ 常用形容詞",
  "💭 副詞與連接詞": "⚙️ 副詞與其他功能詞",
  "💖 心情與感受": "😊 情緒與個性",
  "🏛️ 社會與制度": "🏛️ 社會議題與制度",
  "💰 金錢與商業": "💰 購物與金錢",
  "✈️ 旅遊與假期": "✈️ 旅行與假期",
};
function migrateAllStateNames(){
  for(const [oldN, newN] of Object.entries(V2_RENAME)){
    migrateCategoryName(oldN, newN);
  }
  const validMeta = ["📖 使用說明","🎴 閃卡測驗","□ 未標示清單","✓ 已會清單","★ 不熟清單","📌 口袋單字","⭐ 高頻核心字"];
  if(state.tab && !VOCAB[state.tab] && !validMeta.includes(state.tab)){
    state.tab = "📖 使用說明";
  }
  for(const k of Object.keys(state)){
    if(k.startsWith("mm_idx_") || k.startsWith("mm_collapsed_") || k.startsWith("mm_expanded_")){
      const catN = k.replace(/^mm_(idx|collapsed|expanded)_/, "");
      if(!VOCAB[catN]) delete state[k];
    }
  }
  if(state.mmOverride){
    for(const k of Object.keys(state.mmOverride)){
      // 1. key 不在 VOCAB 中 → 刪除
      if(!VOCAB[k]){ delete state.mmOverride[k]; continue; }
      // 2. value 不是陣列、或含非整數（v1.1 舊字串 slug）→ 刪除
      const arr = state.mmOverride[k];
      if(!Array.isArray(arr) || arr.some(i=> typeof i !== "number")){
        delete state.mmOverride[k];
        continue;
      }
      // 3. 過濾掉不在範圍內的 index
      const clean = arr.filter(i=> MINDMAPS_ALL[i]);
      if(!clean.length) delete state.mmOverride[k];
      else state.mmOverride[k] = clean;
    }
  }
}
migrateAllStateNames();

function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function escHTML(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const totalCount = Object.values(VOCAB).reduce((n,arr)=>n+arr.length,0);
document.getElementById("total-count").textContent = totalCount;

function renderTabs(){
  const metaTabs = ["📖 使用說明", "🎴 閃卡測驗", "□ 未標示清單", "✓ 已會清單", "★ 不熟清單", "📌 口袋單字"];
  const allVocab = Object.keys(VOCAB);
  const mainTabs = ["🌐 主架構心智圖", ...allVocab.filter(t=>!t.startsWith("📦"))];
  const suppTabs = ["⭐ 高頻核心字", ...allVocab.filter(t=>t.startsWith("📦"))];
  const countOf = (t)=>{
    if(VOCAB[t]) return VOCAB[t].length;
    if(t === "📌 口袋單字") return Object.keys(state.pocket).length;
    if(t === "□ 未標示清單"){
      const all = Object.values(VOCAB).flat();
      return all.filter(it=>!state.known[it[0]] && !state.unfam[it[0]]).length;
    }
    if(t === "🌐 主架構心智圖") return -1; // 不顯示計數
    if(t === "⭐ 高頻核心字"){
      return Object.values(VOCAB).flat().filter(it=>(it[5]||0)>=5).length;
    }
    if(t === "✓ 已會清單") return Object.keys(state.known).length;
    if(t === "★ 不熟清單") return Object.keys(state.unfam).length;
    return 0;
  };
  const tabHTML = (t)=>{
    const n = countOf(t);
    const ct = (n >= 0 && (VOCAB[t] || n)) ? `<span class="ct">${n}</span>` : "";
    const active = t === state.tab ? "active" : "";
    return `<button class="tab ${active}" data-tab="${escHTML(t)}">${escHTML(t)}${ct}</button>`;
  };
  document.getElementById("tabs-meta").innerHTML = metaTabs.map(tabHTML).join("");
  document.getElementById("tabs-main").innerHTML = mainTabs.map(tabHTML).join("");
  document.getElementById("tabs-supp").innerHTML = suppTabs.map(tabHTML).join("");
  document.querySelectorAll(".tabs-wrap .tab").forEach(b=>b.onclick = ()=>{ state.tab = b.dataset.tab; state.selecting=false; save(); render(); });
}

// ==== 發音引擎 ====
let _voices = [];
let _voiceReady = false;

// iPad/Safari 上常見的高品質英文語音 (依優先順序)
const PREFERRED_VOICES = [
  "Samantha",            // iOS/macOS 內建女聲, 美式, 自然
  "Karen",               // 澳洲女聲, 清晰
  "Daniel",              // 英國男聲
  "Moira",               // 愛爾蘭女聲, 清晰
  "Tessa",               // 南非女聲
  "Google US English",   // Chrome 內建
  "Google UK English Female",
  "Microsoft Aria Online",
  "Microsoft Jenny Online",
  "Alex"                 // macOS 男聲
];

function loadVoices(){
  _voices = window.speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) || v.lang === "en");
  _voiceReady = _voices.length > 0;
  if(_voiceReady && !state.voice){
    // 第一次:自動挑最好的
    for(const name of PREFERRED_VOICES){
      const v = _voices.find(x => x.name === name || x.name.includes(name));
      if(v){ state.voice = v.name; save(); break; }
    }
    if(!state.voice && _voices[0]) state.voice = _voices[0].name;
  }
  renderVoicePicker();
}

if("speechSynthesis" in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function renderVoicePicker(){
  const sel = document.getElementById("voice-picker");
  if(!sel || !_voices.length) return;
  sel.innerHTML = _voices.map(v =>
    `<option value="${escHTML(v.name)}" ${v.name === state.voice ? "selected" : ""}>${escHTML(v.name)} (${escHTML(v.lang)})</option>`
  ).join("");
}

function speak(word, opts){
  if(!("speechSynthesis" in window)) return;
  opts = opts || {};
  const u = new SpeechSynthesisUtterance(word);
  const v = _voices.find(x => x.name === state.voice);
  if(v){ u.voice = v; u.lang = v.lang; }
  else { u.lang = "en-US"; }
  u.rate  = opts.rate  != null ? opts.rate  : (state.rate  != null ? state.rate  : 0.85);
  u.pitch = opts.pitch != null ? opts.pitch : (state.pitch != null ? state.pitch : 1);
  u.volume = 1;
  speechSynthesis.cancel();
  // Safari 偶爾 cancel 後立刻 speak 會卡住, 用 setTimeout 緩一下
  setTimeout(()=> speechSynthesis.speak(u), 50);
}

function starHTML(n){
  if(n >= 5) return '<span class="star-tag s5" title="必背核心字">★★★★★</span>';
  if(n >= 4) return '<span class="star-tag s4" title="考試高頻字">★★★★</span>';
  return '';
}

function cardHTML(item){
  const [w, pos, zh, ex, tc, stars] = item;
  const cls = state.known[w] ? "known" : state.unfam[w] ? "unfam" : "";
  const knownOn = state.known[w] ? "on-known" : "";
  const unfamOn = state.unfam[w] ? "on-unfam" : "";
  const pocketOn = state.pocket[w] ? "on" : "";
  const inPocket = state.pocket[w] ? "in-pocket" : "";
  const starCls = stars===5?"has-s5":stars===4?"has-s4":"";
  return `<div class="card ${cls} ${inPocket} ${starCls}" data-w="${escHTML(w)}">
    <button class="pocket-mark ${pocketOn}" data-act="pocket-toggle" title="加入/移出口袋">${state.pocket[w]?"✔":""}</button>
    <div class="actions">
      <button class="icon-btn ${knownOn}" data-act="known" title="已會">✓</button>
      <button class="icon-btn ${unfamOn}" data-act="unfam" title="不熟">★</button>
      <button class="icon-btn" data-act="speak" title="發音">🔊</button>
    </div>
    <div class="w-row">
      <span class="word">${escHTML(w)}</span>${starHTML(stars||0)}
      ${pos.map(p=>`<span class="pos">${escHTML(p)}</span>`).join("")}
    </div>
    <div class="zh">${escHTML(zh)}</div>
    <div class="ex"><span class="en">${escHTML(ex)}</span><span class="tc">${escHTML(tc)}</span></div>
    <button class="pocket-pin ${pocketOn}" data-act="pocket-pin" title="${state.pocket[w]?'點擊移出口袋':'加入口袋單字'}"></button>
  </div>`;
}

function bindCardCommonActions(reRender){
  document.querySelectorAll(".card").forEach(card=>{
    const w = card.dataset.w;
    card.querySelectorAll("[data-act]").forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const act = btn.dataset.act;
        if(act==="speak") return speak(w);
        if(act==="known"){ if(state.known[w]){ delete state.known[w]; } else { state.known[w]=true; delete state.unfam[w]; } }
        if(act==="unfam"){ if(state.unfam[w]){ delete state.unfam[w]; } else { state.unfam[w]=true; delete state.known[w]; } }
        if(act==="pocket-pin" || act==="pocket-toggle"){
          if(state.pocket[w]){ delete state.pocket[w]; } else { state.pocket[w]=true; }
        }
        save(); updateProgress(); renderTabs(); reRender();
      };
    });
  });
}

const MINDMAP_IMG_NAMES = [

  "mindmap_1.2",   // 2: 人物 — 家庭與人際

  "mindmap_13",    // 15: 功能字
];
function mmImgUrl(idx){
  const name = MINDMAP_IMG_NAMES[idx];
  return name ? MINDMAP_IMG_BASE + name + ".webp" : "";
}
function renderMindmapImageOrTree(idx, mm){
  const url = mmImgUrl(idx);
  const safeTitle = String(mm.title||"").replace(/["<>]/g,"");
  if(!url) return `<div class="mm-tree-wrap">${renderTreeHTML(mm.root)}</div>`;
  // <img> 載入失敗時自動 fallback 到樹狀渲染（onerror 內以 innerHTML 替換）
  return `<div class="mm-img-box">
      <img src="${url}" alt="${safeTitle}" loading="lazy"
           onclick="window.__mmZoom && window.__mmZoom(${idx})"
           onerror="this.parentElement.outerHTML='<div class=&quot;mm-tree-wrap mm-fallback&quot;>${renderTreeHTML(mm.root).replace(/'/g,"&#39;").replace(/"/g,"&quot;")}</div>'" />
      <div class="mm-img-hint">點圖片放大 · 載不出來會自動顯示文字版</div>
    </div>`;
}

function renderTreeHTML(node, depth=0){
  if(!node) return '';
  const safe = (s)=>String(s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
  const kids = node.children && node.children.length 
    ? '<ul class="mm-tree">' + node.children.map(c=>renderTreeHTML(c, depth+1)).join('') + '</ul>' 
    : '';
  const cls = depth === 0 ? "mm-root" : depth === 1 ? "mm-l1" : depth === 2 ? "mm-l2" : "mm-l3";
  return depth === 0 
    ? '<div class="'+cls+'">'+safe(node.text)+'</div>'+kids
    : '<li class="'+cls+'"><span class="mm-node">'+safe(node.text)+'</span>'+kids+'</li>';
}

function renderMindmapHTML(name){
  const slugs = getMindmaps(name);
  if(!slugs || !slugs.length) return "";
  const collapsed = state["mm_expanded_"+name] ? "" : "collapsed";
  const idx = state["mm_idx_"+name] || 0;
  const cur = Math.min(idx, slugs.length-1);
  const total = slugs.length;
  const mmIdx = slugs[cur];
  const mm = MINDMAPS_ALL[mmIdx];
  if(!mm) return "";
  const dots = total > 1 ? slugs.map((_,i)=>
    `<button class="mm-dot ${i===cur?"on":""}" data-mm-idx="${i}" aria-label="第 ${i+1} 張"></button>`
  ).join("") : "";
  const arrows = total > 1 ? `
    <button class="mm-iconbtn" data-mm-prev title="上一張">‹</button>
    <span class="mm-counter">${cur+1} / ${total}</span>
    <button class="mm-iconbtn" data-mm-next title="下一張">›</button>` : "";
  return `<div class="mindmap ${collapsed}" data-mm-name="${escHTML(name)}">
    <div class="mm-head">
      <span class="mm-title">🧠 ${escHTML(mm.title)}</span>
      ${total>1 ? `<span class="mm-dots">${dots}</span>` : ""}
      <span class="mm-spacer"></span>
      ${arrows}
      <button class="mm-iconbtn" data-mm-zoom title="放大檢視">⛶</button>
      <button class="mm-iconbtn" data-mm-collapse title="${collapsed?"展開":"收合"}">${collapsed?"▸":"▾"}</button>
    </div>
    <div class="mm-body">
      ${renderMindmapImageOrTree(mmIdx, mm)}
    </div>
  </div>`;
}

function bindMindmapActions(name, container){
  const mm = container.querySelector(`.mindmap[data-mm-name="${CSS.escape(name)}"]`);
  if(!mm) return;
  const slugs = getMindmaps(name);
  const total = slugs.length;
  const go = (i)=>{ state["mm_idx_"+name] = ((i % total) + total) % total; save(); render(); };
  mm.querySelectorAll("[data-mm-idx]").forEach(b=> b.onclick = ()=> go(+b.dataset.mmIdx));
  const prev = mm.querySelector("[data-mm-prev]"); if(prev) prev.onclick = ()=> go((state["mm_idx_"+name]||0)-1);
  const next = mm.querySelector("[data-mm-next]"); if(next) next.onclick = ()=> go((state["mm_idx_"+name]||0)+1);
  const col = mm.querySelector("[data-mm-collapse]"); if(col) col.onclick = ()=>{
    state["mm_expanded_"+name] = !state["mm_expanded_"+name]; save(); render();
  };
  const zoom = mm.querySelector("[data-mm-zoom]"); if(zoom) zoom.onclick = ()=> openMindmapModal(name);
}

window.__mmZoom = function(idx){
  const mm = MINDMAPS_ALL[idx];
  if(!mm) return;
  const url = mmImgUrl(idx);
  const overlay = document.createElement("div");
  overlay.className = "mm-modal mm-img-zoom";
  overlay.innerHTML = `
    <div class="mm-mbar">
      <strong>${escHTML(mm.title)}</strong>
      <button class="btn" data-c>✕ 關閉</button>
    </div>
    <img src="${url}" alt="${escHTML(mm.title)}"
         onerror="this.outerHTML='<div class=&quot;mm-tree-modal&quot; style=&quot;background:#fff;padding:24px;border-radius:8px;max-height:84vh;overflow:auto&quot;>'+\`${renderTreeHTML(mm.root).replace(/`/g,'\\`')}\`+'</div>'">`;
  overlay.querySelector("[data-c]").onclick = ()=> overlay.remove();
  overlay.addEventListener("click", e=>{ if(e.target===overlay) overlay.remove(); });
  document.addEventListener("keydown", function esc(e){ if(e.key==="Escape"){ overlay.remove(); document.removeEventListener("keydown", esc); }});
  document.body.appendChild(overlay);
};

function openMindmapModal(name){
  const slugs = getMindmaps(name);
  if(!slugs.length) return;
  let i = state["mm_idx_"+name] || 0;
  const overlay = document.createElement("div");
  overlay.className = "mm-modal";
  function paint(){
    const cur = Math.min(i, slugs.length-1);
    const mm = MINDMAPS_ALL[slugs[cur]];
    overlay.innerHTML = `
      <div class="mm-mbar">
        <strong>${escHTML(mm.title)}</strong>
        <span style="opacity:.7;font-family:ui-monospace,Menlo,monospace">${cur+1} / ${slugs.length}</span>
        ${slugs.length>1?`<button class="btn" data-go="-1">‹ 上一張</button>
          <button class="btn" data-go="1">下一張 ›</button>`:""}
        <button class="btn" data-close>✕ 關閉</button>
      </div>
      ${renderMindmapImageOrTree(slugs[cur], mm).replace("mm-img-hint","mm-img-hint hidden")}
    `;
    overlay.querySelectorAll("[data-go]").forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); i=((i+(+b.dataset.go))%slugs.length+slugs.length)%slugs.length; state["mm_idx_"+name]=i; save(); paint(); });
    overlay.querySelector("[data-close]").onclick = close;
  }
  function close(){ overlay.remove(); document.removeEventListener("keydown", onKey); render(); }
  function onKey(e){
    if(e.key === "Escape") return close();
    if(e.key === "ArrowLeft" && slugs.length>1){ i=(i-1+slugs.length)%slugs.length; state["mm_idx_"+name]=i; save(); paint(); }
    if(e.key === "ArrowRight" && slugs.length>1){ i=(i+1)%slugs.length; state["mm_idx_"+name]=i; save(); paint(); }
  }
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); });
  document.addEventListener("keydown", onKey);
  paint();
  document.body.appendChild(overlay);
}

function renderTheme(name){
  const items = VOCAB[name] || [];

  const filtered = q ? items.filter(([w,p,zh])=>
    w.toLowerCase().includes(q) || zh.includes(q) || p.some(x=>x.toLowerCase().includes(q))
  ) : items;
  const main = document.getElementById("main");
  document.body.dataset.selecting = state.selecting ? "1" : "";
  const inPocketCount = filtered.filter(it=>state.pocket[it[0]]).length;
  main.innerHTML = `
    ${renderMindmapHTML(name)}
    <h2 class="theme-h">${escHTML(name)}</h2>
    <div class="theme-meta">${filtered.length} / ${items.length} 字 · 已加口袋 ${inPocketCount}</div>
    <div class="pocket-bar">
      <button class="btn ${state.selecting?"active":""}" data-sel-toggle>${state.selecting?"✓ 選取中":"✏️ 選取模式"}</button>
      ${state.selecting ? `
        <button class="btn" data-sel-all>☑ 本頁全選加入口袋</button>

      ` : `<span class="pb-count">點卡片右下角 📌 加入口袋；或開「選取模式」批次選</span>`}

    ${filtered.length ? `<div class="grid">${filtered.map(cardHTML).join("")}</div>` :
      `<div class="empty">沒有符合的單字</div>`}`;
  bindMindmapActions(name, main);
  const sb = main.querySelector("[data-sel-toggle]"); if(sb) sb.onclick = ()=>{ state.selecting = !state.selecting; render(); };
  const sa = main.querySelector("[data-sel-all]"); if(sa) sa.onclick = ()=>{ filtered.forEach(it=> state.pocket[it[0]]=true); save(); updateProgress(); renderTabs(); render(); };

  bindCardCommonActions(()=> renderTheme(name));
}

// ===== v2.0 高頻核心字（虛擬分類）=====
function renderHighFreq(){
  const main = document.getElementById("main");
  const all = Object.entries(VOCAB).flatMap(([t,arr])=>arr.map(it=>[t,it]));
  const seen = new Set();
  const items = [];
  for(const [t,it] of all){
    if((it[5]||0) >= 5 && !seen.has(it[0])){
      seen.add(it[0]);
      items.push(it);
    }
  }
  document.body.dataset.selecting = state.selecting ? "1" : "";
  const groups = { "動詞":[], "名詞":[], "形容詞/副詞":[], "其他":[] };
  for(const it of items){
    const ps = it[1] || [];
    if(ps.includes("v.")) groups["動詞"].push(it);
    else if(ps.includes("n.")) groups["名詞"].push(it);
    else if(ps.some(p=>p==="adj."||p==="adv.")) groups["形容詞/副詞"].push(it);
    else groups["其他"].push(it);
  }
  const filtered = items;
  let html = `
    <div style="background:color-mix(in oklch,var(--accent) 8%,var(--paper));border:1px solid color-mix(in oklch,var(--accent) 30%,var(--rule));border-radius:14px;padding:18px 22px;margin-bottom:18px;font-family:ui-sans-serif,system-ui,sans-serif">
      <h2 style="margin:0 0 4px;font-size:18px;color:var(--ink);font-weight:700">⭐ 高頻核心字（★★★★★ 必背）</h2>
      <p style="margin:6px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.6">
        從 <strong>${Object.keys(VOCAB).length} 個主題分類</strong>中抽出的 <strong>${items.length} 個 ★★★★★ 必背核心字</strong>。<br>
        這些字是英檢初級得分的地基——先背這份背到滾瓜爛熟，再回去攻主題分類字表。
      </p>
    </div>
    <div class="pocket-bar">
      <button class="btn ${state.selecting?"active":""}" data-sel-toggle>${state.selecting?"✓ 選取中":"✏️ 選取模式"}</button>
      ${state.selecting ? `
        <button class="btn" data-sel-all>☑ 本頁全選加入口袋</button>
        <button class="btn" data-sel-none>☐ 本頁全部移出口袋</button>` :
        `<span class="pb-count">可批次將高頻字加入口袋、列印離線複習</span>`}
      <span class="pb-spacer"></span>
      <span class="pb-count">口袋總計：${Object.keys(state.pocket).length}</span>
    </div>`;
  for(const [g, arr] of Object.entries(groups)){
    if(!arr.length) continue;
    html += `<h3 style="margin:20px 0 10px;font-size:16px;color:var(--ink-2)">${g} <span style="color:var(--muted);font-weight:400">(${arr.length})</span></h3>`;
    html += `<div class="grid">${arr.map(cardHTML).join("")}</div>`;
  }
  main.innerHTML = html;
  const sb = main.querySelector("[data-sel-toggle]"); if(sb) sb.onclick = ()=>{ state.selecting = !state.selecting; render(); };
  const sa = main.querySelector("[data-sel-all]"); if(sa) sa.onclick = ()=>{ filtered.forEach(it=> state.pocket[it[0]]=true); save(); updateProgress(); renderTabs(); render(); };
  const sn = main.querySelector("[data-sel-none]"); if(sn) sn.onclick = ()=>{ filtered.forEach(it=> delete state.pocket[it[0]]); save(); updateProgress(); renderTabs(); render(); };
  bindCardCommonActions(()=> renderHighFreq());
}

function renderMmEditor(){
  const root = document.getElementById("mm-editor-section");
  if(!root) return;
  const allCats = Object.keys(VOCAB);
  const rows = allCats.map(cat=>{
    const slugs = getMindmaps(cat);
    const customized = state.mmOverride && state.mmOverride[cat] !== undefined;
    const chips = slugs.length
      ? slugs.map(s=>`<span class="mme-chip">${escHTML(((MINDMAPS_ALL[s]||MINDMAPS_ALL[+s])||{title:String(s)}).title)}</span>`).join("")
      : `<span class="mme-empty">未指定</span>`;
    return `<div class="mme-row ${customized?"mme-customized":""}" data-mme-cat="${escHTML(cat)}">
      <span class="mme-name">${escHTML(cat)}</span>
      <span class="mme-chips">${chips}</span>
      <span class="mme-count">${slugs.length}張</span>
      <button class="btn btn-small" data-mme-edit>✎ 編輯</button>
      ${customized?`<button class="btn btn-small" data-mme-reset title="還原爲預設值">↻</button>`:""}
    </div>`;
  }).join("");
  const total = allCats.length;
  const customCount = Object.keys(state.mmOverride||{}).length;
  root.innerHTML = `
    <h2>🧠 心智圖對照設定 <span style="color:var(--muted);font-weight:400;font-size:12px;margin-left:6px">(進階)</span></h2>
    <div class="mme-sub">預設對照是依檔名推測，可能與實際心智圖內容不一致。在這裡可以手動調整、覆寫預設，設定會隨「備份」一起保存。</div>
    <div class="mme-toolbar">
      <strong style="align-self:center;margin-right:4px">共 ${total} 個分類</strong>
      <span style="color:var(--muted);font-size:12px;align-self:center">已自訂 ${customCount} 個</span>
      <span style="flex:1"></span>
      ${customCount?`<button class="btn btn-small" id="mme-reset-all" style="color:var(--red);border-color:var(--red)">↻ 全部還原預設</button>`:""}
    </div>
    <div class="mme-list">${rows}</div>`;
  root.querySelectorAll("[data-mme-cat]").forEach(row=>{
    const cat = row.dataset.mmeCat;
    const editBtn = row.querySelector("[data-mme-edit]");
    if(editBtn) editBtn.onclick = ()=> openMmEditorModal(cat);
    const resetBtn = row.querySelector("[data-mme-reset]");
    if(resetBtn) resetBtn.onclick = ()=>{
      delete state.mmOverride[cat]; save(); renderMmEditor();
    };
  });
  const resetAll = root.querySelector("#mme-reset-all");
  if(resetAll) resetAll.onclick = ()=>{
    if(confirm(`確定要清除所有 ${customCount} 個自訂對照、還原為預設值嗎？`)){
      state.mmOverride = {}; save(); renderMmEditor();
    }
  };
}

function openMmEditorModal(cat){
  const current = new Set(getMindmaps(cat));
  const overlay = document.createElement("div");
  overlay.className = "mme-modal";
  function paint(){
    overlay.innerHTML = `
      <div class="mme-box" onclick="event.stopPropagation()">
        <h3>✎ ${escHTML(cat)}</h3>
        <div class="mme-hint">勾選要顯示在這個分類頂部的心智圖。點縮圖可看大圖預覽。目前選中 <strong>${current.size}</strong> / ${MINDMAPS_ALL.length}。</div>
        <div class="mme-grid">
          ${MINDMAPS_ALL.map((mmObj,_slugIdx)=>{const slug=String(_slugIdx);
            const on = current.has(slug);
            return `<label class="mme-opt ${on?'on':''}">
              <input type="checkbox" data-slug="${escHTML(slug)}" ${on?'checked':''}>
              <img class="mme-thumb" loading="lazy" src="javascript:void(0)" style="display:none" alt="" onclick="event.preventDefault();event.stopPropagation();window.__mmPreview('${escHTML(slug)}')">
              <span class="mme-slug">${escHTML(slug.replace(/^mindmap_/,'').replace(/_/g,' '))}</span>
            </label>`;
          }).join("")}
        </div>
        <div class="mme-foot">
          <button class="btn btn-small" data-clear>⛔ 全部不選</button>
          <span class="sp"></span>
          <button class="btn btn-small" data-cancel>取消</button>
          <button class="btn btn-small" data-default style="border-color:var(--muted);color:var(--muted)">↻ 還原預設</button>
          <button class="btn btn-small active" data-save>✓ 儲存</button>
        </div>
      </div>`;
    overlay.querySelectorAll("input[data-slug]").forEach(cb=>{
      cb.onchange = ()=>{
        if(cb.checked) current.add(cb.dataset.slug);
        else current.delete(cb.dataset.slug);
        cb.closest(".mme-opt").classList.toggle("on", cb.checked);
        overlay.querySelector(".mme-hint strong").textContent = current.size;
      };
    });
    overlay.querySelector("[data-clear]").onclick = ()=>{ current.clear(); paint(); };
    overlay.querySelector("[data-cancel]").onclick = close;
    overlay.querySelector("[data-default]").onclick = ()=>{ 
      delete state.mmOverride[cat]; save(); renderMmEditor(); close(); 
    };
    overlay.querySelector("[data-save]").onclick = ()=>{
      // 保持 MINDMAP_SLUGS 原本順序
      const ordered = MINDMAPS_ALL.map((_,i)=>String(i)).filter(s=>current.has(s)).map(s=>+s);
      state.mmOverride[cat] = ordered;
      save(); renderMmEditor(); close();
    };
  }
  function close(){ overlay.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key === "Escape") close(); }
  overlay.addEventListener("click", e=>{ if(e.target===overlay) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(overlay);
  paint();
}

// ===== v1.1: 閃卡模式 =====
const FLASH_MODES = ["未標會","不熟","已會","全部"];
function flashPool(){
  const all = Object.entries(VOCAB).flatMap(([t,arr])=>arr);
  switch(state.flashMode){
    case "已會":   return all.filter(([w])=> state.known[w]);
    case "不熟":   return all.filter(([w])=> state.unfam[w]);
    case "全部":   return all;
    case "未標會":
    default:       return all.filter(([w])=> !state.known[w]);
  }
}

function renderFlash(){
  const main = document.getElementById("main");
  const pool = flashPool();
  const modeBar = `
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px;font-family:ui-sans-serif,system-ui,sans-serif">
      <span style="color:var(--muted);font-size:13px;align-self:center;margin-right:4px">模式：</span>
      ${FLASH_MODES.map(m=>`<button class="btn ${m===state.flashMode?"active":""}" data-flash-mode="${m}">${m}</button>`).join("")}
    </div>`;
  if(!pool.length){
    main.innerHTML = modeBar + `<div class="empty">此模式下沒有單字 🎉</div>`;
    main.querySelectorAll("[data-flash-mode]").forEach(b=> b.onclick = ()=>{ state.flashMode = b.dataset.flashMode; save(); renderFlash(); });
    return;
  }
  const idx = Math.floor(Math.random()*pool.length);
  const [w,pos,zh,ex,tc] = pool[idx];
  let flipped = false;
  function paint(){
    main.innerHTML = modeBar + `
      <div style="font-family:ui-sans-serif,system-ui,sans-serif;text-align:center;color:var(--muted);margin-top:10px;font-size:13px">
        模式「${state.flashMode}」共 ${pool.length} 字 · 點卡片翻面
      </div>
      <div class="flash" id="flash">
        ${flipped
          ? `<div><div class="meaning">${escHTML(zh)}</div>
              <div style="margin-top:18px;font-size:15px;color:var(--muted);font-style:italic">${escHTML(ex)}<br>${escHTML(tc)}</div></div>`
          : `<div><div class="big">${escHTML(w)}</div>
              <div style="margin-top:8px">${pos.map(p=>`<span class="pos">${escHTML(p)}</span>`).join(" ")}</div></div>`}
      </div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;font-family:ui-sans-serif,system-ui,sans-serif">
        <button class="btn" id="f-speak">🔊 發音</button>
        <button class="btn" id="f-know">✓ 已會</button>
        <button class="btn" id="f-unfam">★ 不熟</button>
        <button class="btn" id="f-pocket">${state.pocket[w]?"📌 已在口袋":"📌 加入口袋"}</button>
        <button class="btn" id="f-skip">↻ 下一張</button>
      </div>`;
    main.querySelectorAll("[data-flash-mode]").forEach(b=> b.onclick = ()=>{ state.flashMode = b.dataset.flashMode; save(); renderFlash(); });
    document.getElementById("flash").onclick = ()=>{ flipped=!flipped; paint(); };
    document.getElementById("f-speak").onclick = (e)=>{ e.stopPropagation(); speak(w); };
    document.getElementById("f-know").onclick = ()=>{ state.known[w]=true; delete state.unfam[w]; save(); updateProgress(); renderTabs(); renderFlash(); };
    document.getElementById("f-unfam").onclick = ()=>{ state.unfam[w]=true; delete state.known[w]; save(); updateProgress(); renderTabs(); renderFlash(); };
    document.getElementById("f-pocket").onclick = ()=>{ if(state.pocket[w]) delete state.pocket[w]; else state.pocket[w]=true; save(); renderTabs(); paint(); };
    document.getElementById("f-skip").onclick = renderFlash;
  }
  paint();
}

// ===== v1.1: 口袋單字 =====
function renderPocket(){
  const main = document.getElementById("main");
  // 蒐集口袋單字並依分類分組
  const groups = {};
  for(const [theme, arr] of Object.entries(VOCAB)){
    for(const it of arr){
      if(state.pocket[it[0]]) (groups[theme] = groups[theme] || []).push(it);
    }
  }
  const total = Object.keys(state.pocket).length;
  if(!total){
    main.innerHTML = `<div class="empty">📌 口袋還是空的。<br>到任一分類點單字卡右下角的 <strong>📌</strong>，或開「選取模式」批次加入。</div>`;
    return;
  }
  // 工具列 (不會列印)
  const toolbar = `
    <div class="pocket-toolbar no-print">
      <strong style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px">📌 口袋單字 (${total})</strong>
      <span style="color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif">A4 排版 · 列印僅輸出資訊卡</span>
      <span class="pb-spacer"></span>
      <button class="btn" id="pk-print">🖨️ 列印 / 存 PDF</button>
      <button class="btn" id="pk-speak">🔊 依序朗讀</button>
      <button class="btn" id="pk-clear">🗑 清空口袋</button>
    </div>`;
  // 列印區
  const sections = Object.entries(groups).map(([theme, items])=>`
    <h2>${escHTML(theme)} <span style="font-size:11pt;color:#666;font-weight:400">(${items.length} 字)</span></h2>
    <div class="print-grid">${items.map(it=>{
      const [w,pos,zh,ex,tc] = it;
      return `<div class="print-card">
        <div><span class="pc-w">${escHTML(w)}</span>${pos.map(p=>`<span class="pc-pos">${escHTML(p)}</span>`).join("")}</div>
        <div class="pc-zh">${escHTML(zh)}</div>
        <div class="pc-ex">${escHTML(ex)}<span class="pc-tc">${escHTML(tc)}</span></div>
      </div>`;
    }).join("")}</div>`).join("");
  main.innerHTML = `<div class="print-area">
    ${toolbar}
    <div class="print-sheet">
      ${sections}
    </div>
  </div>
  <div class="no-print" style="margin-top:14px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;color:var(--muted);text-align:center">
    💡 列印小撇步：採 3 欄 A4 排版；列印對話框關閉「頁首/頁尾」、邊距選「無 / 自訂 (5–8mm)」、勾選「背景圖形」效果最好。
  </div>`;
  document.getElementById("pk-print").onclick = ()=> window.print();
  document.getElementById("pk-clear").onclick = ()=>{
    if(confirm(`確定清空全部 ${total} 個口袋單字嗎？(已會/不熟標記不受影響)`)){
      state.pocket = {}; save(); updateProgress(); renderTabs(); renderPocket();
    }
  };
  document.getElementById("pk-speak").onclick = ()=>{
    const list = Object.values(groups).flat();
    let i = 0;
    const next = ()=>{
      if(i >= list.length) return;
      const u = new SpeechSynthesisUtterance(list[i][0]);
      const v = _voices.find(x=>x.name===state.voice); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
      u.rate = state.rate||0.85; u.pitch = state.pitch||1;
      u.onend = ()=>{ i++; setTimeout(next, 300); };
      speechSynthesis.speak(u);
    };
    speechSynthesis.cancel(); setTimeout(next, 100);
  };
}

function renderSearchResults(q){
  const main = document.getElementById("main");
  const groups = {};
  let total = 0;
  for(const [theme, arr] of Object.entries(VOCAB)){
    const hits = arr.filter(([w,p,zh])=>
      w.toLowerCase().includes(q) || zh.includes(q) || p.some(x=>x.toLowerCase().includes(q))
    );
    if(hits.length){ groups[theme] = hits; total += hits.length; }
  }
  document.body.dataset.selecting = state.selecting ? "1" : "";
  if(!total){
    main.innerHTML = `<div class="empty">找不到符合 「<strong>${escHTML(q)}</strong>」 的單字。<br><span style="font-size:13px;color:var(--muted)">可以試試單字、中文、或詞類縮寫如 n. / v. / adj.</span></div>`;
    return;
  }
  const flatList = Object.values(groups).flat();
  let html = `
    <div style="margin-bottom:14px;color:var(--muted);font-size:14px">🔍 全分類搜尋「<strong style="color:var(--ink)">${escHTML(q)}</strong>」：共 <strong style="color:var(--ink)">${total}</strong> 個結果，跨 ${Object.keys(groups).length} 個分類</div>
    <div class="pocket-bar">
      <button class="btn ${state.selecting?"active":""}" data-sel-toggle>${state.selecting?"✓ 選取中":"✏️ 選取模式"}</button>
      ${state.selecting ? `
        <button class="btn" data-sel-all>☑ 選取全部結果加入口袋</button>
        <button class="btn" data-sel-none>☐ 全部移出口袋</button>` :
        `<span class="pb-count">可批次選取搜尋結果加入口袋</span>`}
      <span class="pb-spacer"></span>
      <span class="pb-count">口袋總計：${Object.keys(state.pocket).length}</span>
    </div>`;
  for(const t of Object.keys(groups)){
    html += `<h3 style="margin:20px 0 10px;font-size:16px;color:var(--ink-2);display:flex;align-items:baseline;gap:8px">
      <span>${escHTML(t)}</span>
      <span style="color:var(--muted);font-weight:400;font-size:13px">${groups[t].length} 個結果</span>
      <button class="btn" style="margin-left:auto;font-size:12px;padding:3px 10px" data-jump-tab="${escHTML(t)}">前往分類 →</button>
    </h3>`;
    html += `<div class="grid">${groups[t].map(cardHTML).join("")}</div>`;
  }
  main.innerHTML = html;
  const sb = main.querySelector("[data-sel-toggle]"); if(sb) sb.onclick = ()=>{ state.selecting = !state.selecting; renderSearchResults(q); };
  const sa = main.querySelector("[data-sel-all]"); if(sa) sa.onclick = ()=>{ flatList.forEach(it=> state.pocket[it[0]]=true); save(); updateProgress(); renderTabs(); renderSearchResults(q); };
  const sn = main.querySelector("[data-sel-none]"); if(sn) sn.onclick = ()=>{ flatList.forEach(it=> delete state.pocket[it[0]]); save(); updateProgress(); renderTabs(); renderSearchResults(q); };
  main.querySelectorAll("[data-jump-tab]").forEach(b=> b.onclick = ()=>{
    document.getElementById("search").value = "";
    state.tab = b.dataset.jumpTab; save(); renderTabs(); render();
  });
  bindCardCommonActions(()=> renderSearchResults(q));
}

function render(){
  document.querySelectorAll(".tabs-wrap .tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===state.tab));
  // 全局搜尋：只要搜尋框有字，就離開當前分類顯示跨分類結果
  const q = ((document.getElementById("search")||{}).value || "").trim().toLowerCase();
  if(q) return renderSearchResults(q);
  if(state.tab === "📖 使用說明") return renderHelp();
  if(state.tab === "🎴 閃卡測驗") return renderFlash();
  if(state.tab === "✓ 已會清單") return renderFiltered("known");
  if(state.tab === "★ 不熟清單") return renderFiltered("unfam");
  if(state.tab === "□ 未標示清單") return renderFiltered("unset");
  if(state.tab === "📌 口袋單字") return renderPocket();
  if(state.tab === "⭐ 高頻核心字") return renderHighFreq();
  if(state.tab === "🌐 主架構心智圖") return renderMainMindmap();
  renderTheme(state.tab);
}

function renderFiltered(kind){
  const main = document.getElementById("main");
  const all = Object.entries(VOCAB).flatMap(([t,arr])=>arr.map(it=>[t,it]));
  const items = all.filter(([t,it])=> {
    if(kind==="known") return state.known[it[0]];
    if(kind==="unfam") return state.unfam[it[0]];
    if(kind==="unset") return !state.known[it[0]] && !state.unfam[it[0]];
    return false;
  });
  const label = kind==="known" ? "已會" : kind==="unfam" ? "不熟" : "未標示";
  const icon = kind==="known" ? "✓" : kind==="unfam" ? "★" : "□";
  document.body.dataset.selecting = state.selecting ? "1" : "";
  if(!items.length){
    const hint = kind==="unset" 
      ? `🎉 你已經把所有單字都標記過了！<br>到「✓ 已會」或「★ 不熟」清單查看成果。`
      : `尚未標記任何「${label}」單字。<br>到任一主題分頁，點單字卡右上角的 ${icon} 即可加入。`;
    main.innerHTML = `<div class="empty">${hint}</div>`;
    return;
  }
  // group by theme
  const groups = {};
  items.forEach(([t,it])=>{ (groups[t] = groups[t]||[]).push(it); });
  const flatList = items.map(([t,it])=>it);
  const subHint = kind==="unset"
    ? `這些單字還沒被標為「已會」或「不熟」。閃卡測驗預設會从這裡抽。`
    : `可以批次將「${label}」單字加入口袋列印`;
  let html = `
    <div style="margin-bottom:14px;color:var(--muted);font-size:14px">共 ${items.length} 個「${label}」單字</div>
    <div class="pocket-bar">
      <button class="btn ${state.selecting?"active":""}" data-sel-toggle>${state.selecting?"✓ 選取中":"✏️ 選取模式"}</button>
      ${state.selecting ? `
        <button class="btn" data-sel-all>☑ 本頁全選加入口袋</button>
        <button class="btn" data-sel-none>☐ 本頁全部移出口袋</button>` :
        `<span class="pb-count">${subHint}</span>`}
      <span class="pb-spacer"></span>
      <span class="pb-count">口袋總計：${Object.keys(state.pocket).length}</span>
    </div>`;
  for(const t of Object.keys(groups)){
    html += `<h3 style="margin:20px 0 10px;font-size:16px;color:var(--ink-2)">${t} <span style="color:var(--muted);font-weight:400">(${groups[t].length})</span></h3>`;
    html += `<div class="grid">${groups[t].map(cardHTML).join("")}</div>`;
  }
  main.innerHTML = html;
  const sb = main.querySelector("[data-sel-toggle]"); if(sb) sb.onclick = ()=>{ state.selecting = !state.selecting; render(); };
  const sa = main.querySelector("[data-sel-all]"); if(sa) sa.onclick = ()=>{ flatList.forEach(it=> state.pocket[it[0]]=true); save(); updateProgress(); renderTabs(); render(); };
  const sn = main.querySelector("[data-sel-none]"); if(sn) sn.onclick = ()=>{ flatList.forEach(it=> delete state.pocket[it[0]]); save(); updateProgress(); renderTabs(); render(); };
  bindCardCommonActions(()=> renderFiltered(kind));
}

function updateProgress(){
  const k = Object.keys(state.known).length;
  document.getElementById("known-count").textContent = k;
  document.getElementById("known-bar").style.width = (k/totalCount*100)+"%";
}

const BACKUP_KEYS = ["known","unfam","pocket","flashMode","mmOverride","voice","rate","pitch","theme","fs"]; // v1.0 只有前面幾個，沒交集也 OK

function exportBackup(){
  const payload = { app:"GEPT-Elementary", version: BACKUP_VERSION, exportedAt: new Date().toISOString(), data: {} };
  for(const k of BACKUP_KEYS){ if(state[k] !== undefined) payload.data[k] = state[k]; }
  // 心智圖使用者偏好 (mm_idx_*, mm_collapsed_*, mm_expanded_*) 也一併備份
  for(const k of Object.keys(state)){
    if(k.startsWith("mm_idx_") || k.startsWith("mm_collapsed_") || k.startsWith("mm_expanded_")) payload.data[k] = state[k];
  }
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
  a.href = url; a.download = `GEPT-備份-${ts}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function importBackup(file, mode){
  // mode: "merge" (合併) | "replace" (取代)
  const reader = new FileReader();
  reader.onload = ()=>{
    let payload;
    try { payload = JSON.parse(reader.result); }
    catch(e){ alert("匯入失敗：JSON 格式不正確。"); return; }
    // 相容 v1.0：v1.0 備份格式可能是〔整個 state 狀況〕或〔{data:{...}}〕或直接是 known/unfam 物件
    let data = payload.data || payload;
    // 保護：只接受認識的 key
    const accept = {};
    for(const k of BACKUP_KEYS){ if(data[k] !== undefined) accept[k] = data[k]; }
    for(const k of Object.keys(data)){
      if(k.startsWith("mm_idx_") || k.startsWith("mm_collapsed_") || k.startsWith("mm_expanded_")) accept[k] = data[k];
    }
    if(!Object.keys(accept).length){ alert("未在匯入檔中找到可識別的學習資料。"); return; }
    if(mode === "replace"){
      if(!confirm("「取代」將清掉目前本機的已會 / 不熟 / 口袋記錄，確定嗎？")) return;
      for(const k of ["known","unfam","pocket"]) state[k] = {};
    }
    // 合併 / 取代
    for(const k of Object.keys(accept)){
      if(k === "known" || k === "unfam" || k === "pocket"){
        state[k] = mode === "replace" ? (accept[k] || {}) : Object.assign(state[k] || {}, accept[k] || {});
      } else {
        state[k] = accept[k];
      }
    }
    // 保護：舊版可能沒有「未標會」閃卡模式
    if(!state.flashMode || !["全部","已會","未標會","不熟"].includes(state.flashMode)) state.flashMode = "未標會";
    if(!state.pocket) state.pocket = {};
    // v1.2: 匯入舊備份時也要跑一次分類名称遷移
    migrateCategoryName("💼 身分與職業", "💼 職業");
    // v2.0：跨版本變更名同步遷移
    migrateAllStateNames();
    save(); updateProgress(); renderTabs(); render();
    const cnt = (state.known?Object.keys(state.known).length:0)
              + (state.unfam?Object.keys(state.unfam).length:0)
              + (state.pocket?Object.keys(state.pocket).length:0);
    alert(`匯入成功！\n已會 ${Object.keys(state.known).length}、不熟 ${Object.keys(state.unfam).length}、口袋 ${Object.keys(state.pocket).length}`);
  };
  reader.readAsText(file);
}

// 備份 dialog (輕量自製)
document.getElementById("backup-btn").onclick = ()=>{

  dlg.className = "mm-modal";
  dlg.innerHTML = `
    <div style="background:var(--paper);color:var(--ink);border-radius:14px;padding:22px 26px;max-width:480px;width:92%;font-family:ui-sans-serif,system-ui,sans-serif">
      <h3 style="margin:0 0 10px;font-size:17px">💾 備份 / 匯入學習進度</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.6">
        匯出一份 JSON 檔，包含你所有的已會 / 不熟 / 口袋單字、閃卡模式與語音偏好。<br>
        可以跨裝置達到同步，也可與 v1.0 舊備份相容。
      </p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
        <button class="btn" id="bk-export" style="justify-content:center;padding:10px">⬇ 匯出備份檔 (.json)</button>
        <div style="position:relative">
          <input type="file" id="bk-file" accept=".json,application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer">
          <button class="btn" style="width:100%;justify-content:center;padding:10px;pointer-events:none">⬆ 選擇備份檔彙入…</button>
        </div>
      </div>
      <div id="bk-mode" style="display:none;border-top:1px dashed var(--rule);padding-top:14px">
        <p style="font-size:13px;margin:0 0 10px;line-height:1.55">
          <strong id="bk-file-name" style="font-family:ui-monospace,Menlo,monospace;font-size:12px"></strong><br>
          請選擇匯入方式：
        </p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="bk-merge">⊕ 合併 (推薦)</button>
          <button class="btn" id="bk-replace" style="color:var(--red);border-color:var(--red)">⚠ 取代本機資料</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.5">
          合併：備份檔與本機資料取聯集。取代：完全以備份檔為準（達到同步效果）。
        </p>
      </div>
      <div style="text-align:right;border-top:1px solid var(--rule);padding-top:12px">
        <button class="btn" id="bk-close">關閉</button>
      </div>
    </div>`;
  document.body.appendChild(dlg);
  let pendingFile = null;
  const close = ()=> dlg.remove();
  dlg.addEventListener("click", e=>{ if(e.target===dlg) close(); });
  dlg.querySelector("#bk-close").onclick = close;
  dlg.querySelector("#bk-export").onclick = ()=>{ exportBackup(); };
  dlg.querySelector("#bk-file").onchange = (e)=>{
    pendingFile = e.target.files && e.target.files[0];
    if(!pendingFile) return;
    dlg.querySelector("#bk-file-name").textContent = "已選擇：" + pendingFile.name;
    dlg.querySelector("#bk-mode").style.display = "block";
  };
  dlg.querySelector("#bk-merge").onclick = ()=>{ if(pendingFile){ importBackup(pendingFile, "merge"); close(); } };
  dlg.querySelector("#bk-replace").onclick = ()=>{ if(pendingFile){ importBackup(pendingFile, "replace"); close(); } };
};

renderTabs();
updateProgress();
render();
</script>
</body>
</html>
