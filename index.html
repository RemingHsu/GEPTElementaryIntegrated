  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"沒人知道。\"],\n    [\"everything\",[\"pron.\"],\"每件事\",\"Everything is fine.\",\"一切都好。\"],\n    [\"something\",[\"pron.\"],\"某物\",\"I want something to eat.\",\"我想吃點東西。\"],\n    [\"anything\",[\"pron.\"],\"任何東西\",\"Do you need anything?\",\"你需要什麼嗎?\"],\n    [\"nothing\",[\"pron.\"],\"沒什麼\",\"Nothing happened.\",\"什麼事都沒發生。\"]\n  ]\n});\n// 註: 此 starter 約 350 字,其餘來自 data/*.js 檔案。\n\nconst VOCAB = window.VOCAB;\n\n// ============ 應用程式 ============\nconst STORE_KEY = \"gept_v1\";\nlet state = JSON.parse(localStorage.getItem(STORE_KEY) || \"{}\");\nstate.known = state.known || {};\nstate.unfam = state.unfam || {};\nstate.tab = state.tab || Object.keys(VOCAB)[0];\nstate.fs = state.fs || 16;\nstate.theme = state.theme || \"light\";\n\nfunction save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }\nfunction escHTML(s){ return String(s).replace(/[&<>\"']/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c])); }\n\nconst totalCount = Object.values(VOCAB).reduce((n,arr)=>n+arr.length,0);\ndocument.getElementById(\"total-count\").textContent = totalCount;\n\nfunction renderTabs(){\n  const tabs = document.getElementById(\"tabs\");\n  const themes = [\"📖 使用說明\", \"🎴 閃卡測驗\", \"✓ 已會清單\", \"★ 不熟清單\", ...Object.keys(VOCAB)];\n  tabs.innerHTML = themes.map(t=>{\n    const ct = VOCAB[t] ? `<span class=\"ct\">${VOCAB[t].length}<\u002Fspan>` : \"\";\n    const active = t === state.tab ? \"active\" : \"\";\n    return `<button class=\"tab ${active}\" data-tab=\"${escHTML(t)}\">${escHTML(t)}${ct}<\u002Fbutton>`;\n  }).join(\"\");\n  tabs.querySelectorAll(\".tab\").forEach(b=>b.onclick = ()=>{ state.tab = b.dataset.tab; save(); render(); });\n}\n\n// ==== 發音引擎 ====\nlet _voices = [];\nlet _voiceReady = false;\n\n// iPad/Safari 上常見的高品質英文語音 (依優先順序)\nconst PREFERRED_VOICES = [\n  \"Samantha\",            // iOS/macOS 內建女聲, 美式, 自然\n  \"Karen\",               // 澳洲女聲, 清晰\n  \"Daniel\",              // 英國男聲\n  \"Moira\",               // 愛爾蘭女聲, 清晰\n  \"Tessa\",               // 南非女聲\n  \"Google US English\",   // Chrome 內建\n  \"Google UK English Female\",\n  \"Microsoft Aria Online\",\n  \"Microsoft Jenny Online\",\n  \"Alex\"                 // macOS 男聲\n];\n\nfunction loadVoices(){\n  _voices = window.speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) || v.lang === \"en\");\n  _voiceReady = _voices.length > 0;\n  if(_voiceReady && !state.voice){\n    // 第一次:自動挑最好的\n    for(const name of PREFERRED_VOICES){\n      const v = _voices.find(x => x.name === name || x.name.includes(name));\n      if(v){ state.voice = v.name; save(); break; }\n    }\n    if(!state.voice && _voices[0]) state.voice = _voices[0].name;\n  }\n  renderVoicePicker();\n}\n\nif(\"speechSynthesis\" in window){\n  loadVoices();\n  window.speechSynthesis.onvoiceschanged = loadVoices;\n}\n\nfunction renderVoicePicker(){\n  const sel = document.getElementById(\"voice-picker\");\n  if(!sel || !_voices.length) return;\n  sel.innerHTML = _voices.map(v =>\n    `<option value=\"${escHTML(v.name)}\" ${v.name === state.voice ? \"selected\" : \"\"}>${escHTML(v.name)} (${escHTML(v.lang)})<\u002Foption>`\n  ).join(\"\");\n}\n\nfunction speak(word, opts){\n  if(!(\"speechSynthesis\" in window)) return;\n  opts = opts || {};\n  const u = new SpeechSynthesisUtterance(word);\n  const v = _voices.find(x => x.name === state.voice);\n  if(v){ u.voice = v; u.lang = v.lang; }\n  else { u.lang = \"en-US\"; }\n  u.rate  = opts.rate  != null ? opts.rate  : (state.rate  != null ? state.rate  : 0.85);\n  u.pitch = opts.pitch != null ? opts.pitch : (state.pitch != null ? state.pitch : 1);\n  u.volume = 1;\n  speechSynthesis.cancel();\n  // Safari 偶爾 cancel 後立刻 speak 會卡住, 用 setTimeout 緩一下\n  setTimeout(()=> speechSynthesis.speak(u), 50);\n}\n\nfunction cardHTML(item){\n  const [w, pos, zh, ex, tc] = item;\n  const cls = state.known[w] ? \"known\" : state.unfam[w] ? \"unfam\" : \"\";\n  const knownOn = state.known[w] ? \"on-known\" : \"\";\n  const unfamOn = state.unfam[w] ? \"on-unfam\" : \"\";\n  return `<div class=\"card ${cls}\" data-w=\"${escHTML(w)}\">\n    <div class=\"actions\">\n      <button class=\"icon-btn ${knownOn}\" data-act=\"known\" title=\"已會\">✓<\u002Fbutton>\n      <button class=\"icon-btn ${unfamOn}\" data-act=\"unfam\" title=\"不熟\">★<\u002Fbutton>\n      <button class=\"icon-btn\" data-act=\"speak\" title=\"發音\">🔊<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"w-row\">\n      <span class=\"word\">${escHTML(w)}<\u002Fspan>\n      ${pos.map(p=>`<span class=\"pos\">${escHTML(p)}<\u002Fspan>`).join(\"\")}\n    <\u002Fdiv>\n    <div class=\"zh\">${escHTML(zh)}<\u002Fdiv>\n    <div class=\"ex\"><span class=\"en\">${escHTML(ex)}<\u002Fspan><span class=\"tc\">${escHTML(tc)}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction renderTheme(name){\n  const items = VOCAB[name] || [];\n  const q = (document.getElementById(\"search\").value || \"\").trim().toLowerCase();\n  const filtered = q ? items.filter(([w,p,zh])=>\n    w.toLowerCase().includes(q) || zh.includes(q) || p.some(x=>x.toLowerCase().includes(q))\n  ) : items;\n  const main = document.getElementById(\"main\");\n  main.innerHTML = `\n    <h2 class=\"theme-h\">${escHTML(name)}<\u002Fh2>\n    <div class=\"theme-meta\">${filtered.length} / ${items.length} 字<\u002Fdiv>\n    ${filtered.length ? `<div class=\"grid\">${filtered.map(cardHTML).join(\"\")}<\u002Fdiv>` :\n      `<div class=\"empty\">沒有符合的單字<\u002Fdiv>`}`;\n  main.querySelectorAll(\".card\").forEach(card=>{\n    const w = card.dataset.w;\n    card.querySelectorAll(\"[data-act]\").forEach(btn=>{\n      btn.onclick = (e)=>{\n        e.stopPropagation();\n        const act = btn.dataset.act;\n        if(act===\"speak\") return speak(w);\n        if(act===\"known\"){ if(state.known[w]){ delete state.known[w]; } else { state.known[w]=true; delete state.unfam[w]; } }\n        if(act===\"unfam\"){ if(state.unfam[w]){ delete state.unfam[w]; } else { state.unfam[w]=true; delete state.known[w]; } }\n        save(); updateProgress(); renderTheme(name);\n      };\n    });\n  });\n}\n\nfunction renderHelp(){\n  const main = document.getElementById(\"main\");\n  main.innerHTML = `\n    <div class=\"notice\">\n      <strong>📱 基本操作<\u002Fstrong><br>\n      • 點 <strong>✓<\u002Fstrong> 標記已會 / <strong>★<\u002Fstrong> 標記不熟<br>\n      • 點 <strong>🔊<\u002Fstrong> 朗讀單字 (用 iPad/iPhone 內建語音)<br>\n      • 頂部搜尋框可同時搜尋 <em>單字、中文、詞類<\u002Fem><br>\n      • 「🎴 閃卡測驗」隨機練習未會的字<br>\n      • 「✓ 已會清單 / ★ 不熟清單」依主題檢視已標記的字<br>\n      • 工具列 <strong>🔊 語音<\u002Fstrong> 可選聲音、調語速與音調(建議 Samantha / Daniel)<br>\n      • 工具列 <strong>A− / A+<\u002Fstrong> 調字級,<strong>◐<\u002Fstrong> 切換深淺色\n    <\u002Fdiv>\n    <div class=\"notice\" style=\"background:color-mix(in oklch,var(--green) 10%,var(--paper));border-color:color-mix(in oklch,var(--green) 40%,var(--rule))\">\n      <strong>💾 進度保存與備份(重要)<\u002Fstrong><br>\n      <strong>學習進度(已會 / 不熟)儲存於本機瀏覽器<\u002Fstrong>,跟網頁伺服器或 GitHub 無關,所以離線也保留。<br><br>\n      <strong>會清掉記錄的情況:<\u002Fstrong><br>\n      • Safari 連續 7 天沒打開該網頁(會自動清儲存)<br>\n      • 清除 Safari 瀏覽資料 / 換手機 / 換瀏覽器<br><br>\n      <strong>解決方法:<\u002Fstrong><br>\n      ① <strong>加到主畫面<\u002Fstrong>(Safari 分享 → 加入主畫面):像 App 一樣使用,進度長期保留,不受 7 天限制。<br>\n      ② <strong>定期匯出備份<\u002Fstrong>:點工具列 <strong>💾 備份 → ⬇ 匯出進度<\u002Fstrong>,會下載一個 JSON 檔,存到 iCloud/Google Drive。<br>\n      ③ <strong>跨裝置同步<\u002Fstrong>:在另一台裝置點 <strong>💾 備份 → ⬆ 匯入進度<\u002Fstrong>,選備份檔即可。已會與不熟採聯集合併,不會覆蓋原有進度。\n    <\u002Fdiv>\n    <div class=\"legend\">\n      <h2>詞類縮寫對照<\u002Fh2>\n      <table>${POS_LEGEND.map(([a,f,z])=>`\n        <tr><td><span class=\"pos\">${a}<\u002Fspan><\u002Ftd><td>${f}<\u002Ftd><td>${z}<\u002Ftd><\u002Ftr>`).join(\"\")}\n      <\u002Ftable>\n    <\u002Fdiv>\n    <div class=\"notice\" style=\"background:color-mix(in oklch,var(--accent) 10%,var(--paper));border-color:color-mix(in oklch,var(--accent) 40%,var(--rule))\">\n      <strong>✅ 資料完整度<\u002Fstrong><br>\n      已完整收錄 LTTC 全民英檢初級官方字表 <strong>2,213 字<\u002Fstrong>,共 ${totalCount} 個條目 (含一字多類別交叉收錄)。\n      涵蓋:人物、職業、身體、食物、動物、天氣、家居、學校、城市、交通、衣物、顏色、時間、數字、動作、形容詞、副詞、抽象概念、代名詞、Be 動詞、助動詞等所有主題。\n      所有單字皆附詞類縮寫、中文意思、英文例句與中文翻譯。\n    <\u002Fdiv>`;\n}\n\nfunction renderFlash(){\n  const all = Object.entries(VOCAB).flatMap(([t,arr])=>arr);\n  const pool = all.filter(([w])=>!state.known[w]);\n  const main = document.getElementById(\"main\");\n  if(!pool.length){\n    main.innerHTML = `<div class=\"empty\">🎉 全部都會了!<\u002Fdiv>`;\n    return;\n  }\n  const idx = Math.floor(Math.random()*pool.length);\n  const [w,pos,zh,ex,tc] = pool[idx];\n  let flipped = false;\n  function paint(){\n    main.innerHTML = `\n      <div style=\"font-family:ui-sans-serif,system-ui,sans-serif;text-align:center;color:var(--muted);margin-top:8px;font-size:13px\">\n        剩 ${pool.length} 字未標「會」 · 點卡片翻面\n      <\u002Fdiv>\n      <div class=\"flash\" id=\"flash\">\n        ${flipped\n          ? `<div><div class=\"meaning\">${escHTML(zh)}<\u002Fdiv>\n              <div style=\"margin-top:18px;font-size:15px;color:var(--muted);font-style:italic\">${escHTML(ex)}<br>${escHTML(tc)}<\u002Fdiv><\u002Fdiv>`\n          : `<div><div class=\"big\">${escHTML(w)}<\u002Fdiv>\n              <div style=\"margin-top:8px\">${pos.map(p=>`<span class=\"pos\">${escHTML(p)}<\u002Fspan>`).join(\" \")}<\u002Fdiv><\u002Fdiv>`}\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;justify-content:center;margin-top:18px;font-family:ui-sans-serif,system-ui,sans-serif\">\n        <button class=\"btn\" id=\"f-speak\">🔊 發音<\u002Fbutton>\n        <button class=\"btn\" id=\"f-know\">✓ 已會<\u002Fbutton>\n        <button class=\"btn\" id=\"f-skip\">↻ 下一張<\u002Fbutton>\n      <\u002Fdiv>`;\n    document.getElementById(\"flash\").onclick = ()=>{ flipped=!flipped; paint(); };\n    document.getElementById(\"f-speak\").onclick = (e)=>{ e.stopPropagation(); speak(w); };\n    document.getElementById(\"f-know\").onclick = ()=>{ state.known[w]=true; delete state.unfam[w]; save(); updateProgress(); renderFlash(); };\n    document.getElementById(\"f-skip\").onclick = renderFlash;\n  }\n  paint();\n}\n\nfunction render(){\n  document.querySelectorAll(\".tab\").forEach(t=>t.classList.toggle(\"active\", t.dataset.tab===state.tab));\n  if(state.tab === \"📖 使用說明\") return renderHelp();\n  if(state.tab === \"🎴 閃卡測驗\") return renderFlash();\n  if(state.tab === \"✓ 已會清單\") return renderFiltered(\"known\");\n  if(state.tab === \"★ 不熟清單\") return renderFiltered(\"unfam\");\n  renderTheme(state.tab);\n}\n\nfunction renderFiltered(kind){\n  const main = document.getElementById(\"main\");\n  const all = Object.entries(VOCAB).flatMap(([t,arr])=>arr.map(it=>[t,it]));\n  const items = all.filter(([t,it])=> kind===\"known\" ? state.known[it[0]] : state.unfam[it[0]]);\n  const label = kind===\"known\" ? \"已會\" : \"不熟\";\n  if(!items.length){\n    main.innerHTML = `<div class=\"empty\">尚未標記任何「${label}」單字。<br>到任一主題分頁,點單字卡右上角的 ${kind===\"known\"?\"✓\":\"★\"} 即可加入。<\u002Fdiv>`;\n    return;\n  }\n  // group by theme\n  const groups = {};\n  items.forEach(([t,it])=>{ (groups[t] = groups[t]||[]).push(it); });\n  let html = `<div style=\"margin-bottom:14px;color:var(--muted);font-size:14px\">共 ${items.length} 個「${label}」單字<\u002Fdiv>`;\n  for(const t of Object.keys(groups)){\n    html += `<h3 style=\"margin:20px 0 10px;font-size:16px;color:var(--ink-2)\">${t} <span style=\"color:var(--muted);font-weight:400\">(${groups[t].length})<\u002Fspan><\u002Fh3>`;\n    html += `<div class=\"grid\">${groups[t].map(cardHTML).join(\"\")}<\u002Fdiv>`;\n  }\n  main.innerHTML = html;\n  bindCardActions(state.tab);\n}\n\nfunction bindCardActions(name){\n  document.querySelectorAll(\".card\").forEach(card=>{\n    const w = card.dataset.w;\n    card.querySelectorAll(\"button\").forEach(btn=>{\n      btn.onclick = ()=>{\n        const act = btn.dataset.act;\n        if(act===\"speak\") return speak(w);\n        if(act===\"known\"){ if(state.known[w]){ delete state.known[w]; } else { state.known[w]=true; delete state.unfam[w]; } }\n        if(act===\"unfam\"){ if(state.unfam[w]){ delete state.unfam[w]; } else { state.unfam[w]=true; delete state.known[w]; } }\n        save(); updateProgress(); render();\n      };\n    });\n  });\n}\n\nfunction updateProgress(){\n  // Clean up any falsy entries left over from older saves\n  for(const k in state.known){ if(!state.known[k]) delete state.known[k]; }\n  for(const k in state.unfam){ if(!state.unfam[k]) delete state.unfam[k]; }\n  const k = Object.keys(state.known).length;\n  document.getElementById(\"known-count\").textContent = k;\n  document.getElementById(\"known-bar\").style.width = (k/totalCount*100)+\"%\";\n}\n\n// ============ 初始化 ============\ndocument.documentElement.dataset.theme = state.theme;\ndocument.body.style.setProperty(\"--fs\", state.fs+\"px\");\n\ndocument.getElementById(\"search\").oninput = ()=>{\n  if(VOCAB[state.tab]) renderTheme(state.tab);\n};\ndocument.getElementById(\"font-bigger\").onclick = ()=>{ state.fs=Math.min(22,state.fs+1); document.body.style.setProperty(\"--fs\",state.fs+\"px\"); save(); };\ndocument.getElementById(\"font-smaller\").onclick = ()=>{ state.fs=Math.max(13,state.fs-1); document.body.style.setProperty(\"--fs\",state.fs+\"px\"); save(); };\ndocument.getElementById(\"theme-toggle\").onclick = ()=>{\n  state.theme = state.theme===\"dark\" ? \"light\" : \"dark\";\n  document.documentElement.dataset.theme = state.theme; save();\n};\n\n// ==== 語音設定面板 ====\nconst voiceBtn = document.getElementById(\"voice-btn\");\nconst voicePanel = document.getElementById(\"voice-panel\");\nconst voicePicker = document.getElementById(\"voice-picker\");\nconst rateSlider = document.getElementById(\"rate-slider\");\nconst pitchSlider = document.getElementById(\"pitch-slider\");\nconst rateVal = document.getElementById(\"rate-val\");\nconst pitchVal = document.getElementById(\"pitch-val\");\n\nstate.rate = state.rate != null ? state.rate : 0.85;\nstate.pitch = state.pitch != null ? state.pitch : 1.0;\nrateSlider.value = state.rate; rateVal.textContent = Number(state.rate).toFixed(2);\npitchSlider.value = state.pitch; pitchVal.textContent = Number(state.pitch).toFixed(2);\n\nvoiceBtn.onclick = ()=>{\n  const open = voicePanel.hasAttribute(\"hidden\");\n  if(open){ voicePanel.removeAttribute(\"hidden\"); voiceBtn.classList.add(\"active\"); }\n  else    { voicePanel.setAttribute(\"hidden\",\"\"); voiceBtn.classList.remove(\"active\"); }\n};\nvoicePicker.onchange = ()=>{ state.voice = voicePicker.value; save(); };\nrateSlider.oninput = ()=>{ state.rate = parseFloat(rateSlider.value); rateVal.textContent = state.rate.toFixed(2); save(); };\npitchSlider.oninput = ()=>{ state.pitch = parseFloat(pitchSlider.value); pitchVal.textContent = state.pitch.toFixed(2); save(); };\ndocument.getElementById(\"voice-test\").onclick = ()=> speak(\"Hello, this is your selected voice.\");\n\n// ==== 備份與還原 ====\nconst backupBtn = document.getElementById(\"backup-btn\");\nconst backupPanel = document.getElementById(\"backup-panel\");\nconst backupStatus = document.getElementById(\"backup-status\");\nbackupBtn.onclick = ()=>{\n  const open = backupPanel.hasAttribute(\"hidden\");\n  if(open){ backupPanel.removeAttribute(\"hidden\"); backupBtn.classList.add(\"active\"); }\n  else { backupPanel.setAttribute(\"hidden\",\"\"); backupBtn.classList.remove(\"active\"); }\n};\ndocument.getElementById(\"backup-export\").onclick = ()=>{\n  const data = {\n    app: \"GEPT-Elementary\",\n    version: 1,\n    exportedAt: new Date().toISOString(),\n    state: state\n  };\n  const blob = new Blob([JSON.stringify(data, null, 2)], {type:\"application/json\"});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  const ts = new Date().toISOString().slice(0,10);\n  a.href = url; a.download = `GEPT進度備份_${ts}.json`;\n  document.body.appendChild(a); a.click();\n  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);\n  const knownN = Object.values(state.known||{}).filter(Boolean).length;\n  const unfamN = Object.values(state.unfam||{}).filter(Boolean).length;\n  backupStatus.textContent = `✅ 已匯出 ${knownN} 已會、${unfamN} 不熟。請妥善保存此檔。`;\n};\ndocument.getElementById(\"backup-import\").onclick = ()=> document.getElementById(\"backup-file\").click();\ndocument.getElementById(\"backup-file\").onchange = (e)=>{\n  const f = e.target.files[0]; if(!f) return;\n  const reader = new FileReader();\n  reader.onload = ()=>{\n    try {\n      const data = JSON.parse(reader.result);\n      if(data.app !== \"GEPT-Elementary\" || !data.state) throw new Error(\"非本 App 的備份檔\");\n      const incoming = data.state;\n      const beforeKnown = Object.keys(state.known||{}).filter(k=>state.known[k]).length;\n      const beforeUnfam = Object.keys(state.unfam||{}).filter(k=>state.unfam[k]).length;\n      // 合併:已會與不熟採聯集\n      state.known = Object.assign({}, state.known||{}, incoming.known||{});\n      state.unfam = Object.assign({}, state.unfam||{}, incoming.unfam||{});\n      // 其他偏好設定 (字級/主題/語音) 採覆蓋\n      [\"fs\",\"theme\",\"voiceURI\",\"rate\",\"pitch\",\"tab\"].forEach(k=>{\n        if(incoming[k] !== undefined) state[k] = incoming[k];\n      });\n      save();\n      // 即時更新畫面\n      document.body.style.setProperty(\"--fs\", state.fs+\"px\");\n      document.documentElement.dataset.theme = state.theme;\n      if(VOCAB[state.tab]) renderTheme(state.tab);\n      renderTabs();\n      const afterKnown = Object.keys(state.known||{}).filter(k=>state.known[k]).length;\n      const afterUnfam = Object.keys(state.unfam||{}).filter(k=>state.unfam[k]).length;\n      backupStatus.textContent = `✅ 匯入完成。已會 ${beforeKnown}→${afterKnown}、不熟 ${beforeUnfam}→${afterUnfam}。`;\n    } catch(err){\n      backupStatus.textContent = `❌ 匯入失敗:${err.message}`;\n    }\n    e.target.value = \"\";\n  };\n  reader.readAsText(f);\n};\n\nrenderTabs();\nupdateProgress();\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
