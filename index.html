<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GEPT 初級單字 v1.1</title>
<style>
:root{
  --bg:#fafaf7; --paper:#fff; --ink:#1a1a1a; --ink-2:#3a3a37;
  --muted:#8a8a85; --rule:#e6e4dc;
  --accent:oklch(0.55 0.12 35); --green:oklch(0.55 0.12 145);
  --yellow:oklch(0.78 0.14 90); --red:oklch(0.58 0.16 25);
  --fs:16px;
}
[data-theme="dark"]{--bg:#16161a;--paper:#1e1e22;--ink:#ececec;--ink-2:#c8c8c8;--muted:#8a8a90;--rule:#2e2e34;
  --accent:oklch(0.72 0.12 35);--green:oklch(0.72 0.12 145);--yellow:oklch(0.85 0.14 90);--red:oklch(0.72 0.16 25);}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:ui-serif,"Iowan Old Style","Noto Serif TC",Georgia,serif;font-size:var(--fs);line-height:1.55;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--rule);padding:14px 24px 10px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:600}
h1 .sub{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px;font-family:ui-sans-serif,system-ui,sans-serif}
input.search{flex:1;min-width:220px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:9px 14px;color:var(--ink);font:inherit;font-size:15px;font-family:ui-sans-serif,system-ui,sans-serif}
.tools{display:flex;gap:6px;align-items:center;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px}
.btn{background:transparent;color:var(--ink-2);border:1px solid var(--rule);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--rule);background:var(--bg);position:sticky;top:62px;z-index:49;font-family:ui-sans-serif,system-ui,sans-serif}
.tab{flex-shrink:0;padding:10px 14px;cursor:pointer;color:var(--muted);border:none;background:transparent;border-bottom:2px solid transparent;white-space:nowrap;font-size:14px;font-family:inherit}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .ct{color:var(--muted);font-size:11px;margin-left:4px}
main{padding:20px 28px 80px;max-width:1400px;margin:0 auto}
.theme-h{font-size:24px;margin:0 0 4px;font-weight:600}
.theme-meta{color:var(--muted);font-size:13px;margin-bottom:16px;font-family:ui-sans-serif,system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;position:relative}
.card.known{border-color:var(--green)}
.card.unfam{border-color:var(--red)}
.w-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word{font-size:22px;font-weight:600;font-family:"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
.pos{display:inline-block;font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--rule);color:var(--ink-2);font-family:ui-monospace,Menlo,monospace}
.zh{color:var(--ink-2);margin:6px 0 8px;font-size:15px}
.ex{font-size:14px;border-top:1px dashed var(--rule);padding-top:8px}
.ex .en{color:var(--ink);display:block}
.ex .tc{color:var(--muted);font-size:13px}
.actions{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.icon-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-size:13px;color:var(--muted)}
.icon-btn.on-known{color:var(--green);border-color:var(--green)}
.icon-btn.on-unfam{color:var(--red);border-color:var(--red)}
.legend{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px 22px;margin-bottom:18px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px}
.legend h2{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:500}
.legend table{width:100%;border-collapse:collapse}
.legend td{padding:6px 8px;border-bottom:1px dashed var(--rule);font-size:13.5px}
.flash{width:min(640px,92vw);aspect-ratio:16/10;background:var(--paper);border:1px solid var(--rule);border-radius:20px;display:grid;place-items:center;padding:32px;cursor:pointer;text-align:center;margin:20px auto}
.flash .big{font-size:54px;font-weight:600;font-family:"SF Pro Display",Helvetica,sans-serif}
.flash .meaning{font-size:28px;color:var(--ink-2)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.progress-pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted)}
.progress-pill .bar{width:60px;height:4px;background:var(--rule);border-radius:99px;overflow:hidden}
.progress-pill .bar i{display:block;height:100%;background:var(--green);width:0}
.notice{background:color-mix(in oklch,var(--yellow) 18%,var(--paper));border:1px solid color-mix(in oklch,var(--yellow) 50%,var(--rule));border-radius:12px;padding:14px 18px;margin-bottom:16px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13.5px;line-height:1.6}
mark{background:color-mix(in oklch,var(--yellow) 60%,transparent);padding:0 2px;border-radius:2px}
.voice-panel{margin-top:10px;padding:12px 16px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px}
.voice-panel .vp-row{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.voice-panel label{min-width:36px;color:var(--muted)}
.voice-panel select{background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;font:inherit;flex:1;min-width:200px;max-width:420px}
.voice-panel input[type=range]{flex:1;max-width:240px}
.voice-panel .vp-val{font-family:ui-monospace,monospace;color:var(--muted);min-width:40px}
.voice-panel .vp-hint{color:var(--muted);font-size:12px}
.btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ===== v1.1: 心智圖 ===== */
.mindmap{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 16px 16px;margin:0 0 18px;font-family:ui-sans-serif,system-ui,sans-serif}
.mindmap .mm-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.mindmap .mm-title{font-weight:600;color:var(--ink-2);font-size:14px}
.mindmap .mm-spacer{flex:1}
.mindmap .mm-dots{display:flex;gap:6px}
.mindmap .mm-dot{width:8px;height:8px;border-radius:50%;background:var(--rule);border:none;cursor:pointer;padding:0}
.mindmap .mm-dot.on{background:var(--accent)}
.mindmap .mm-counter{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);min-width:34px;text-align:center}
.mindmap .mm-iconbtn{width:28px;height:28px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);cursor:pointer;color:var(--ink-2);font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.mindmap .mm-iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.mindmap .mm-img-wrap{position:relative;background:color-mix(in oklch,var(--rule) 35%,var(--paper));border-radius:10px;overflow:hidden;text-align:center}
.mindmap .mm-img-wrap img{display:block;max-width:100%;width:auto;max-height:480px;margin:0 auto;cursor:zoom-in;background:#fff}
.mindmap .mm-img-wrap .mm-fail{padding:34px 20px;color:var(--muted);font-size:13px}
.mindmap.collapsed .mm-body{display:none}
.mindmap.collapsed{padding:10px 16px}

/* full-screen zoom modal */
.mm-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:12px}
.mm-modal img{max-width:100%;max-height:88vh;background:#fff;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.mm-modal .mm-mbar{display:flex;gap:10px;align-items:center;color:#fff;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px}
.mm-modal .mm-mbar .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}

/* ===== v1.1: 口袋單字選取 UI ===== */
.pocket-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px}
.pocket-bar .pb-count{color:var(--muted)}
.pocket-bar .pb-spacer{flex:1}
.card .pocket-mark{position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;color:var(--accent);padding:0}
body[data-selecting="1"] .card .pocket-mark{display:inline-flex}
body[data-selecting="1"] .card{padding-left:42px}
.card .pocket-mark.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card .pocket-pin{position:absolute;bottom:8px;right:10px;background:transparent;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:4px 6px;border-radius:6px}
.card .pocket-pin.on{color:var(--accent)}
.card .pocket-pin:hover{background:var(--rule)}

/* ===== v1.1: 口袋單字 / 列印版 ===== */
.pocket-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13.5px}
.print-sheet{background:#fff;color:#000;padding:8mm 8mm;border:1px solid var(--rule);border-radius:8px;font-family:ui-serif,"Iowan Old Style","Noto Serif TC",Georgia,serif}
.print-sheet h2{margin:0 0 6mm;font-size:18px;border-bottom:1px solid #999;padding-bottom:3mm}
.print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.print-card{border:1px solid #bbb;border-radius:4px;padding:2.2mm 3mm;page-break-inside:avoid;background:#fff}
.print-card .pc-w{font-size:12.5pt;font-weight:600;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.2}
.print-card .pc-pos{display:inline-block;font-size:7pt;padding:0 3px;border:1px solid #999;border-radius:3px;margin-left:4px;font-family:ui-monospace,Menlo,monospace;color:#444;vertical-align:1px}
.print-card .pc-zh{margin:1mm 0 1.2mm;font-size:9.5pt;color:#222;line-height:1.35}
.print-card .pc-ex{font-size:8pt;color:#333;border-top:1px dotted #aaa;padding-top:1.2mm;line-height:1.4}
.print-card .pc-ex .pc-tc{display:block;color:#666;font-size:7.5pt;margin-top:0.4mm}
@media print{
  @page{size:A4;margin:6mm}
  html,body{background:#fff !important;color:#000 !important}
  body *{visibility:hidden !important}
  .print-area,.print-area *{visibility:visible !important}
  .print-area{position:absolute;left:0;top:0;width:100%;padding:0;margin:0}
  .print-area .no-print{display:none !important}
  .print-sheet{border:none;border-radius:0;padding:0}
  .print-card{border-color:#999}
}

/* ===== v1.1: changelog ===== */
.changelog{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px 22px;margin-bottom:18px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13.5px}
.changelog h2{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:500}
.changelog .ver{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.changelog .ver:last-child{border-bottom:none}
.changelog .ver-tag{flex-shrink:0;font-family:ui-monospace,Menlo,monospace;background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:4px;font-size:12px;height:fit-content;margin-top:2px}
.changelog .ver-tag.minor{background:var(--accent)}
.changelog .ver-body{flex:1;font-size:13.5px;line-height:1.7}
.changelog .ver-date{color:var(--muted);font-size:12px;margin-left:6px}
.changelog ul{margin:4px 0 0;padding-left:18px}
.changelog li{margin:2px 0}
</style>
</head>
<body>
<header>
  <div class="row" style="margin-bottom:8px">
    <h1>GEPT 初級單字 <span class="sub">LTTC · 2,216 字 · v1.1</span></h1>
    <input class="search" id="search" type="search" placeholder="🔍 搜尋單字 / 中文 / 詞類…" autocomplete="off">
    <div class="tools">
      <span class="progress-pill"><span id="known-count">0</span>/<span id="total-count">0</span><span class="bar"><i id="known-bar"></i></span></span>
      <button class="btn" id="voice-btn" title="語音設定">🔊 語音</button>
      <button class="btn" id="backup-btn" title="匯出 / 匯入學習進度">💾 備份</button>
      <button class="btn" id="font-smaller">A−</button>
      <button class="btn" id="font-bigger">A+</button>
      <button class="btn" id="theme-toggle">◐</button>
    </div>
  </div>
  <div id="voice-panel" class="voice-panel" hidden>
    <div class="vp-row">
      <label>語音</label>
      <select id="voice-picker"></select>
    </div>
    <div class="vp-row">
      <label>語速</label>
      <input type="range" id="rate-slider" min="0.5" max="1.2" step="0.05">
      <span id="rate-val" class="vp-val">0.85</span>
    </div>
    <div class="vp-row">
      <label>音調</label>
      <input type="range" id="pitch-slider" min="0.7" max="1.3" step="0.05">
      <span id="pitch-val" class="vp-val">1.00</span>
    </div>
    <div class="vp-row">
      <button class="btn" id="voice-test">▶ 試聽 "hello"</button>
      <span class="vp-hint">在 iPad 上建議選 Samantha / Karen / Daniel</span>

  </div>
</header>

// ============ 應用程式 ============
const STORE_KEY = "gept_v1";
let state = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
state.known = state.known || {};
state.unfam = state.unfam || {};
state.pocket = state.pocket || {};                      // v1.1
state.flashMode = state.flashMode || "未標會";          // v1.1: 全部/已會/未標會/不熟
state.selecting = false;                                // v1.1: 選取模式 (不持久)
state.tab = state.tab || Object.keys(VOCAB)[0];
state.fs = state.fs || 16;
state.theme = state.theme || "light";

function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function escHTML(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const totalCount = Object.values(VOCAB).reduce((n,arr)=>n+arr.length,0);
document.getElementById("total-count").textContent = totalCount;

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const themes = ["📖 使用說明", "🎴 閃卡測驗", "✓ 已會清單", "★ 不熟清單", "📌 口袋單字", ...Object.keys(VOCAB)];
  tabs.innerHTML = themes.map(t=>{
    let ct = "";
    if(VOCAB[t]) ct = `<span class="ct">${VOCAB[t].length}</span>`;
    else if(t === "📌 口袋單字"){
      const n = Object.keys(state.pocket).length;
      if(n) ct = `<span class="ct">${n}</span>`;
    }
    const active = t === state.tab ? "active" : "";
    return `<button class="tab ${active}" data-tab="${escHTML(t)}">${escHTML(t)}${ct}</button>`;
  }).join("");
  tabs.querySelectorAll(".tab").forEach(b=>b.onclick = ()=>{ state.tab = b.dataset.tab; state.selecting=false; save(); render(); });
}

const PREFERRED_VOICES = [
  "Samantha",            // iOS/macOS 內建女聲, 美式, 自然
  "Karen",               // 澳洲女聲, 清晰
  "Daniel",              // 英國男聲

function loadVoices(){
  _voices = window.speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) || v.lang === "en");
  _voiceReady = _voices.length > 0;
  if(_voiceReady && !state.voice){
    // 第一次:自動挑最好的
    for(const name of PREFERRED_VOICES){
      const v = _voices.find(x => x.name === name || x.name.includes(name));
      if(v){ state.voice = v.name; save(); break; }
    }
    if(!state.voice && _voices[0]) state.voice = _voices[0].name;
  }
  renderVoicePicker();
}

if("speechSynthesis" in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function renderVoicePicker(){
  const sel = document.getElementById("voice-picker");
  if(!sel || !_voices.length) return;
  sel.innerHTML = _voices.map(v =>
    `<option value="${escHTML(v.name)}" ${v.name === state.voice ? "selected" : ""}>${escHTML(v.name)} (${escHTML(v.lang)})</option>`
  ).join("");
}

function speak(word, opts){
  if(!("speechSynthesis" in window)) return;
  opts = opts || {};
  const u = new SpeechSynthesisUtterance(word);
  const v = _voices.find(x => x.name === state.voice);
  if(v){ u.voice = v; u.lang = v.lang; }
  else { u.lang = "en-US"; }
  u.rate  = opts.rate  != null ? opts.rate  : (state.rate  != null ? state.rate  : 0.85);
  u.pitch = opts.pitch != null ? opts.pitch : (state.pitch != null ? state.pitch : 1);
  u.volume = 1;
  speechSynthesis.cancel();
  // Safari 偶爾 cancel 後立刻 speak 會卡住, 用 setTimeout 緩一下
  setTimeout(()=> speechSynthesis.speak(u), 50);
}

function cardHTML(item){
  const [w, pos, zh, ex, tc] = item;
  const cls = state.known[w] ? "known" : state.unfam[w] ? "unfam" : "";
  const knownOn = state.known[w] ? "on-known" : "";
  const unfamOn = state.unfam[w] ? "on-unfam" : "";
  const pocketOn = state.pocket[w] ? "on" : "";
  return `<div class="card ${cls}" data-w="${escHTML(w)}">
    <button class="pocket-mark ${pocketOn}" data-act="pocket-toggle" title="加入/移出口袋">${state.pocket[w]?"✔":""}</button>
    <div class="actions">
      <button class="icon-btn ${knownOn}" data-act="known" title="已會">✓</button>
      <button class="icon-btn ${unfamOn}" data-act="unfam" title="不熟">★</button>
      <button class="icon-btn" data-act="speak" title="發音">🔊</button>
    </div>
    <div class="w-row">
      <span class="word">${escHTML(w)}</span>
      ${pos.map(p=>`<span class="pos">${escHTML(p)}</span>`).join("")}
    </div>
    <div class="zh">${escHTML(zh)}</div>
    <div class="ex"><span class="en">${escHTML(ex)}</span><span class="tc">${escHTML(tc)}</span></div>
    <button class="pocket-pin ${pocketOn}" data-act="pocket-pin" title="加入口袋單字">📌</button>
  </div>`;
}

function bindCardCommonActions(reRender){
  document.querySelectorAll(".card").forEach(card=>{
    const w = card.dataset.w;
    card.querySelectorAll("[data-act]").forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const act = btn.dataset.act;
        if(act==="speak") return speak(w);
        if(act==="known"){ if(state.known[w]){ delete state.known[w]; } else { state.known[w]=true; delete state.unfam[w]; } }
        if(act==="unfam"){ if(state.unfam[w]){ delete state.unfam[w]; } else { state.unfam[w]=true; delete state.known[w]; } }
        if(act==="pocket-pin" || act==="pocket-toggle"){
          if(state.pocket[w]){ delete state.pocket[w]; } else { state.pocket[w]=true; }
        }
        save(); updateProgress(); renderTabs(); reRender();
      };
    });
  });
}

function renderMindmapHTML(name){
  const slugs = MINDMAP_MAP[name];
  if(!slugs || !slugs.length) return "";
  const collapsed = state["mm_collapsed_"+name] ? "collapsed" : "";
  const idx = state["mm_idx_"+name] || 0;
  const cur = Math.min(idx, slugs.length-1);
  const total = slugs.length;
  const url = MINDMAP_BASE + slugs[cur] + ".png";
  const dots = total > 1 ? slugs.map((_,i)=>
    `<button class="mm-dot ${i===cur?"on":""}" data-mm-idx="${i}" aria-label="第 ${i+1} 張"></button>`
  ).join("") : "";
  const arrows = total > 1 ? `
    <button class="mm-iconbtn" data-mm-prev title="上一張">‹</button>
    <span class="mm-counter">${cur+1} / ${total}</span>
    <button class="mm-iconbtn" data-mm-next title="下一張">›</button>` : "";
  return `<div class="mindmap ${collapsed}" data-mm-name="${escHTML(name)}">
    <div class="mm-head">
      <span class="mm-title">🧠 ${escHTML(name)} 心智圖</span>
      ${total>1 ? `<span class="mm-dots">${dots}</span>` : ""}
      <span class="mm-spacer"></span>
      ${arrows}
      <button class="mm-iconbtn" data-mm-zoom title="放大檢視">⛶</button>
      <button class="mm-iconbtn" data-mm-collapse title="${collapsed?"展開":"收合"}">${collapsed?"▸":"▾"}</button>
    </div>
    <div class="mm-body">
      <div class="mm-img-wrap">
        <img src="${url}" alt="${escHTML(name)} 心智圖 ${cur+1}/${total}"
             onerror="this.outerHTML='<div class=&quot;mm-fail&quot;>心智圖載入失敗<br><small>${escHTML(slugs[cur])}.png</small></div>'">
      </div>
    </div>
  </div>`;
}

function bindMindmapActions(name, container){
  const mm = container.querySelector(`.mindmap[data-mm-name="${CSS.escape(name)}"]`);
  if(!mm) return;
  const slugs = MINDMAP_MAP[name] || [];
  const total = slugs.length;
  const go = (i)=>{ state["mm_idx_"+name] = ((i % total) + total) % total; save(); render(); };
  mm.querySelectorAll("[data-mm-idx]").forEach(b=> b.onclick = ()=> go(+b.dataset.mmIdx));
  const prev = mm.querySelector("[data-mm-prev]"); if(prev) prev.onclick = ()=> go((state["mm_idx_"+name]||0)-1);
  const next = mm.querySelector("[data-mm-next]"); if(next) next.onclick = ()=> go((state["mm_idx_"+name]||0)+1);
  const col = mm.querySelector("[data-mm-collapse]"); if(col) col.onclick = ()=>{
    state["mm_collapsed_"+name] = !state["mm_collapsed_"+name]; save(); render();
  };
  const zoom = mm.querySelector("[data-mm-zoom]"); if(zoom) zoom.onclick = ()=> openMindmapModal(name);
  const img = mm.querySelector("img"); if(img) img.onclick = ()=> openMindmapModal(name);
}

function openMindmapModal(name){
  const slugs = MINDMAP_MAP[name] || [];
  if(!slugs.length) return;
  let i = state["mm_idx_"+name] || 0;
  const overlay = document.createElement("div");
  overlay.className = "mm-modal";
  function paint(){
    const cur = Math.min(i, slugs.length-1);
    overlay.innerHTML = `
      <div class="mm-mbar">
        <strong>${escHTML(name)} 心智圖</strong>
        <span style="opacity:.7;font-family:ui-monospace,Menlo,monospace">${cur+1} / ${slugs.length}</span>
        ${slugs.length>1?`<button class="btn" data-go="-1">‹ 上一張</button>
          <button class="btn" data-go="1">下一張 ›</button>`:""}
        <button class="btn" data-close>✕ 關閉</button>
      </div>
      <img src="${MINDMAP_BASE+slugs[cur]+".png"}" alt="${escHTML(name)} 心智圖">`;
    overlay.querySelectorAll("[data-go]").forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); i=((i+(+b.dataset.go))%slugs.length+slugs.length)%slugs.length; state["mm_idx_"+name]=i; save(); paint(); });
    overlay.querySelector("[data-close]").onclick = close;
  }
  function close(){ overlay.remove(); document.removeEventListener("keydown", onKey); render(); }
  function onKey(e){
    if(e.key === "Escape") return close();
    if(e.key === "ArrowLeft" && slugs.length>1){ i=(i-1+slugs.length)%slugs.length; state["mm_idx_"+name]=i; save(); paint(); }
    if(e.key === "ArrowRight" && slugs.length>1){ i=(i+1)%slugs.length; state["mm_idx_"+name]=i; save(); paint(); }
  }
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); });
  document.addEventListener("keydown", onKey);
  paint();
  document.body.appendChild(overlay);
}

function renderTheme(name){
  const items = VOCAB[name] || [];
  const q = (document.getElementById("search").value || "").trim().toLowerCase();
  const filtered = q ? items.filter(([w,p,zh])=>
    w.toLowerCase().includes(q) || zh.includes(q) || p.some(x=>x.toLowerCase().includes(q))
  ) : items;
  const main = document.getElementById("main");
  document.body.dataset.selecting = state.selecting ? "1" : "";
  const inPocketCount = filtered.filter(it=>state.pocket[it[0]]).length;
  main.innerHTML = `
    ${renderMindmapHTML(name)}
    <h2 class="theme-h">${escHTML(name)}</h2>
    <div class="theme-meta">${filtered.length} / ${items.length} 字 · 已加口袋 ${inPocketCount}</div>
    <div class="pocket-bar">
      <button class="btn ${state.selecting?"active":""}" data-sel-toggle>${state.selecting?"✓ 選取中":"✏️ 選取模式"}</button>

    </div>
    ${filtered.length ? `<div class="grid">${filtered.map(cardHTML).join("")}</div>` :

  bindMindmapActions(name, main);

  const sn = main.querySelector("[data-sel-none]"); if(sn) sn.onclick = ()=>{ filtered.forEach(it=> delete state.pocket[it[0]]); save(); updateProgress(); renderTabs(); render(); };
  bindCardCommonActions(()=> renderTheme(name));
}

// ===== v1.1: 閃卡模式 =====
const FLASH_MODES = ["未標會","不熟","已會","全部"];
function flashPool(){
  const all = Object.entries(VOCAB).flatMap(([t,arr])=>arr);
  switch(state.flashMode){
    case "已會":   return all.filter(([w])=> state.known[w]);
    case "不熟":   return all.filter(([w])=> state.unfam[w]);
    case "全部":   return all;
    case "未標會":
    default:       return all.filter(([w])=> !state.known[w]);
  }
}

function renderFlash(){
  const main = document.getElementById("main");
  const pool = flashPool();
  const modeBar = `
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px;font-family:ui-sans-serif,system-ui,sans-serif">
      <span style="color:var(--muted);font-size:13px;align-self:center;margin-right:4px">模式：</span>
      ${FLASH_MODES.map(m=>`<button class="btn ${m===state.flashMode?"active":""}" data-flash-mode="${m}">${m}</button>`).join("")}
    </div>`;
  if(!pool.length){
    main.innerHTML = modeBar + `<div class="empty">此模式下沒有單字 🎉</div>`;
    main.querySelectorAll("[data-flash-mode]").forEach(b=> b.onclick = ()=>{ state.flashMode = b.dataset.flashMode; save(); renderFlash(); });
    return;
  }
  const idx = Math.floor(Math.random()*pool.length);
  const [w,pos,zh,ex,tc] = pool[idx];
  let flipped = false;
  function paint(){
    main.innerHTML = modeBar + `
      <div style="font-family:ui-sans-serif,system-ui,sans-serif;text-align:center;color:var(--muted);margin-top:10px;font-size:13px">
        模式「${state.flashMode}」共 ${pool.length} 字 · 點卡片翻面
      </div>
      <div class="flash" id="flash">
        ${flipped
          ? `<div><div class="meaning">${escHTML(zh)}</div>
              <div style="margin-top:18px;font-size:15px;color:var(--muted);font-style:italic">${escHTML(ex)}<br>${escHTML(tc)}</div></div>`
          : `<div><div class="big">${escHTML(w)}</div>
              <div style="margin-top:8px">${pos.map(p=>`<span class="pos">${escHTML(p)}</span>`).join(" ")}</div></div>`}
      </div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;font-family:ui-sans-serif,system-ui,sans-serif">
        <button class="btn" id="f-speak">🔊 發音</button>
        <button class="btn" id="f-know">✓ 已會</button>
        <button class="btn" id="f-unfam">★ 不熟</button>
        <button class="btn" id="f-pocket">${state.pocket[w]?"📌 已在口袋":"📌 加入口袋"}</button>
        <button class="btn" id="f-skip">↻ 下一張</button>
      </div>`;
    main.querySelectorAll("[data-flash-mode]").forEach(b=> b.onclick = ()=>{ state.flashMode = b.dataset.flashMode; save(); renderFlash(); });
    document.getElementById("flash").onclick = ()=>{ flipped=!flipped; paint(); };
    document.getElementById("f-speak").onclick = (e)=>{ e.stopPropagation(); speak(w); };
    document.getElementById("f-know").onclick = ()=>{ state.known[w]=true; delete state.unfam[w]; save(); updateProgress(); renderTabs(); renderFlash(); };
    document.getElementById("f-unfam").onclick = ()=>{ state.unfam[w]=true; delete state.known[w]; save(); updateProgress(); renderTabs(); renderFlash(); };
    document.getElementById("f-pocket").onclick = ()=>{ if(state.pocket[w]) delete state.pocket[w]; else state.pocket[w]=true; save(); renderTabs(); paint(); };
    document.getElementById("f-skip").onclick = renderFlash;
  }
  paint();
}

// ===== v1.1: 口袋單字 =====
function renderPocket(){
  const main = document.getElementById("main");
  // 蒐集口袋單字並依分類分組
  const groups = {};
  for(const [theme, arr] of Object.entries(VOCAB)){
    for(const it of arr){
      if(state.pocket[it[0]]) (groups[theme] = groups[theme] || []).push(it);
    }
  }
  const total = Object.keys(state.pocket).length;
  if(!total){
    main.innerHTML = `<div class="empty">📌 口袋還是空的。<br>到任一分類點單字卡右下角的 <strong>📌</strong>，或開「選取模式」批次加入。</div>`;
    return;
  }
  // 工具列 (不會列印)
  const toolbar = `
    <div class="pocket-toolbar no-print">
      <strong style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px">📌 口袋單字 (${total})</strong>
      <span style="color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif">A4 排版 · 列印僅輸出資訊卡</span>
      <span class="pb-spacer"></span>
      <button class="btn" id="pk-print">🖨️ 列印 / 存 PDF</button>
      <button class="btn" id="pk-speak">🔊 依序朗讀</button>
      <button class="btn" id="pk-clear">🗑 清空口袋</button>
    </div>`;
  // 列印區
  const sections = Object.entries(groups).map(([theme, items])=>`
    <h2>${escHTML(theme)} <span style="font-size:11pt;color:#666;font-weight:400">(${items.length} 字)</span></h2>
    <div class="print-grid">${items.map(it=>{
      const [w,pos,zh,ex,tc] = it;
      return `<div class="print-card">
        <div><span class="pc-w">${escHTML(w)}</span>${pos.map(p=>`<span class="pc-pos">${escHTML(p)}</span>`).join("")}</div>
        <div class="pc-zh">${escHTML(zh)}</div>
        <div class="pc-ex">${escHTML(ex)}<span class="pc-tc">${escHTML(tc)}</span></div>
      </div>`;
    }).join("")}</div>`).join("");
  main.innerHTML = `<div class="print-area">
    ${toolbar}
    <div class="print-sheet">
      ${sections}
    </div>
  </div>
  <div class="no-print" style="margin-top:14px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;color:var(--muted);text-align:center">
    💡 列印小撇步：採 3 欄 A4 排版；列印對話框關閉「頁首/頁尾」、邊距選「無 / 自訂 (5–8mm)」、勾選「背景圖形」效果最好。
  </div>`;
  document.getElementById("pk-print").onclick = ()=> window.print();
  document.getElementById("pk-clear").onclick = ()=>{
    if(confirm(`確定清空全部 ${total} 個口袋單字嗎？(已會/不熟標記不受影響)`)){
      state.pocket = {}; save(); updateProgress(); renderTabs(); renderPocket();
    }
  };
  document.getElementById("pk-speak").onclick = ()=>{
    const list = Object.values(groups).flat();
    let i = 0;
    const next = ()=>{
      if(i >= list.length) return;
      const u = new SpeechSynthesisUtterance(list[i][0]);
      const v = _voices.find(x=>x.name===state.voice); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
      u.rate = state.rate||0.85; u.pitch = state.pitch||1;
      u.onend = ()=>{ i++; setTimeout(next, 300); };
      speechSynthesis.speak(u);
    };
    speechSynthesis.cancel(); setTimeout(next, 100);
  };
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===state.tab));
  if(state.tab === "📖 使用說明") return renderHelp();
  if(state.tab === "🎴 閃卡測驗") return renderFlash();
  if(state.tab === "✓ 已會清單") return renderFiltered("known");
  if(state.tab === "★ 不熟清單") return renderFiltered("unfam");
  if(state.tab === "📌 口袋單字") return renderPocket();
  renderTheme(state.tab);
}

function renderFiltered(kind){
  const main = document.getElementById("main");
  const all = Object.entries(VOCAB).flatMap(([t,arr])=>arr.map(it=>[t,it]));
  const items = all.filter(([t,it])=> kind==="known" ? state.known[it[0]] : state.unfam[it[0]]);
  const label = kind==="known" ? "已會" : "不熟";
  document.body.dataset.selecting = state.selecting ? "1" : "";
  if(!items.length){
    main.innerHTML = `<div class="empty">尚未標記任何「${label}」單字。<br>到任一主題分頁,點單字卡右上角的 ${kind==="known"?"✓":"★"} 即可加入。</div>`;
    return;
  }
  // group by theme
  const groups = {};
  items.forEach(([t,it])=>{ (groups[t] = groups[t]||[]).push(it); });
  const flatList = items.map(([t,it])=>it);
  let html = `
    <div style="margin-bottom:14px;color:var(--muted);font-size:14px">共 ${items.length} 個「${label}」單字</div>
    <div class="pocket-bar">
      <button class="btn ${state.selecting?"active":""}" data-sel-toggle>${state.selecting?"✓ 選取中":"✏️ 選取模式"}</button>
      ${state.selecting ? `
        <button class="btn" data-sel-all>☑ 本頁全選加入口袋</button>
        <button class="btn" data-sel-none>☐ 本頁全部移出口袋</button>` :
        `<span class="pb-count">可以批次將「${label}」單字加入口袋列印</span>`}
      <span class="pb-spacer"></span>
      <span class="pb-count">口袋總計：${Object.keys(state.pocket).length}</span>
    </div>`;
  for(const t of Object.keys(groups)){
    html += `<h3 style="margin:20px 0 10px;font-size:16px;color:var(--ink-2)">${t} <span style="color:var(--muted);font-weight:400">(${groups[t].length})</span></h3>`;
    html += `<div class="grid">${groups[t].map(cardHTML).join("")}</div>`;
  }
  main.innerHTML = html;
  const sb = main.querySelector("[data-sel-toggle]"); if(sb) sb.onclick = ()=>{ state.selecting = !state.selecting; render(); };
  const sa = main.querySelector("[data-sel-all]"); if(sa) sa.onclick = ()=>{ flatList.forEach(it=> state.pocket[it[0]]=true); save(); updateProgress(); renderTabs(); render(); };
  const sn = main.querySelector("[data-sel-none]"); if(sn) sn.onclick = ()=>{ flatList.forEach(it=> delete state.pocket[it[0]]); save(); updateProgress(); renderTabs(); render(); };
  bindCardCommonActions(()=> renderFiltered(kind));
}

function updateProgress(){
  const k = Object.keys(state.known).length;
  document.getElementById("known-count").textContent = k;
  document.getElementById("known-bar").style.width = (k/totalCount*100)+"%";
}

// ============ 初始化 ============
document.documentElement.dataset.theme = state.theme;
document.body.style.setProperty("--fs", state.fs+"px");

document.getElementById("search").oninput = ()=>{
  if(VOCAB[state.tab]) renderTheme(state.tab);
};
document.getElementById("font-bigger").onclick = ()=>{ state.fs=Math.min(22,state.fs+1); document.body.style.setProperty("--fs",state.fs+"px"); save(); };
document.getElementById("font-smaller").onclick = ()=>{ state.fs=Math.max(13,state.fs-1); document.body.style.setProperty("--fs",state.fs+"px"); save(); };

  state.theme = state.theme==="dark" ? "light" : "dark";

// ==== 語音設定面板 ====
const voiceBtn = document.getElementById("voice-btn");
const voicePanel = document.getElementById("voice-panel");
const voicePicker = document.getElementById("voice-picker");
const rateSlider = document.getElementById("rate-slider");
const pitchSlider = document.getElementById("pitch-slider");
const rateVal = document.getElementById("rate-val");
const pitchVal = document.getElementById("pitch-val");

state.rate = state.rate != null ? state.rate : 0.85;
state.pitch = state.pitch != null ? state.pitch : 1.0;
rateSlider.value = state.rate; rateVal.textContent = Number(state.rate).toFixed(2);
pitchSlider.value = state.pitch; pitchVal.textContent = Number(state.pitch).toFixed(2);

voiceBtn.onclick = ()=>{

document.getElementById("voice-test").onclick = ()=> speak("Hello, this is your selected voice.");

// ==== v1.1: 備份 / 匯入 匯出 JSON (相容 v1.0) ====
const BACKUP_VERSION = "1.1";
const BACKUP_KEYS = ["known","unfam","pocket","flashMode","voice","rate","pitch","theme","fs"]; // v1.0 只有前面幾個，沒交集也 OK

function exportBackup(){
  const payload = { app:"GEPT-Elementary", version: BACKUP_VERSION, exportedAt: new Date().toISOString(), data: {} };
  for(const k of BACKUP_KEYS){ if(state[k] !== undefined) payload.data[k] = state[k]; }
  // 心智圖使用者偏好 (mm_idx_*, mm_collapsed_*) 也一併備份
  for(const k of Object.keys(state)){
    if(k.startsWith("mm_idx_") || k.startsWith("mm_collapsed_")) payload.data[k] = state[k];
  }
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
  a.href = url; a.download = `GEPT-備份-${ts}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function importBackup(file, mode){
  // mode: "merge" (合併) | "replace" (取代)
  const reader = new FileReader();
  reader.onload = ()=>{
    let payload;
    try { payload = JSON.parse(reader.result); }
    catch(e){ alert("匯入失敗：JSON 格式不正確。"); return; }
    // 相容 v1.0：v1.0 備份格式可能是〔整個 state 狀況〕或〔{data:{...}}〕或直接是 known/unfam 物件
    let data = payload.data || payload;
    // 保護：只接受認識的 key
    const accept = {};
    for(const k of BACKUP_KEYS){ if(data[k] !== undefined) accept[k] = data[k]; }
    for(const k of Object.keys(data)){
      if(k.startsWith("mm_idx_") || k.startsWith("mm_collapsed_")) accept[k] = data[k];
    }
    if(!Object.keys(accept).length){ alert("未在匯入檔中找到可識別的學習資料。"); return; }
    if(mode === "replace"){
      if(!confirm("「取代」將清掉目前本機的已會 / 不熟 / 口袋記錄，確定嗎？")) return;
      for(const k of ["known","unfam","pocket"]) state[k] = {};
    }
    // 合併 / 取代
    for(const k of Object.keys(accept)){
      if(k === "known" || k === "unfam" || k === "pocket"){
        state[k] = mode === "replace" ? (accept[k] || {}) : Object.assign(state[k] || {}, accept[k] || {});
      } else {
        state[k] = accept[k];
      }
    }
    // 保護：舊版可能沒有「未標會」閃卡模式
    if(!state.flashMode || !["全部","已會","未標會","不熟"].includes(state.flashMode)) state.flashMode = "未標會";
    if(!state.pocket) state.pocket = {};
    save(); updateProgress(); renderTabs(); render();
    const cnt = (state.known?Object.keys(state.known).length:0)
              + (state.unfam?Object.keys(state.unfam).length:0)
              + (state.pocket?Object.keys(state.pocket).length:0);
    alert(`匯入成功！\n已會 ${Object.keys(state.known).length}、不熟 ${Object.keys(state.unfam).length}、口袋 ${Object.keys(state.pocket).length}`);
  };
  reader.readAsText(file);
}

// 備份 dialog (輕量自製)
document.getElementById("backup-btn").onclick = ()=>{
  const dlg = document.createElement("div");
  dlg.className = "mm-modal";
  dlg.innerHTML = `
    <div style="background:var(--paper);color:var(--ink);border-radius:14px;padding:22px 26px;max-width:480px;width:92%;font-family:ui-sans-serif,system-ui,sans-serif">
      <h3 style="margin:0 0 10px;font-size:17px">💾 備份 / 匯入學習進度</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.6">
        匯出一份 JSON 檔，包含你所有的已會 / 不熟 / 口袋單字、閃卡模式與語音偏好。<br>
        可以跨裝置達到同步，也可與 v1.0 舊備份相容。
      </p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
        <button class="btn" id="bk-export" style="justify-content:center;padding:10px">⬇ 匯出備份檔 (.json)</button>
        <div style="position:relative">
          <input type="file" id="bk-file" accept=".json,application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer">
          <button class="btn" style="width:100%;justify-content:center;padding:10px;pointer-events:none">⬆ 選擇備份檔彙入…</button>
        </div>
      </div>
      <div id="bk-mode" style="display:none;border-top:1px dashed var(--rule);padding-top:14px">
        <p style="font-size:13px;margin:0 0 10px;line-height:1.55">
          <strong id="bk-file-name" style="font-family:ui-monospace,Menlo,monospace;font-size:12px"></strong><br>
          請選擇匯入方式：
        </p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="bk-merge">⊕ 合併 (推薦)</button>
          <button class="btn" id="bk-replace" style="color:var(--red);border-color:var(--red)">⚠ 取代本機資料</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.5">
          合併：備份檔與本機資料取聯集。取代：完全以備份檔為準（達到同步效果）。
        </p>
      </div>
      <div style="text-align:right;border-top:1px solid var(--rule);padding-top:12px">
        <button class="btn" id="bk-close">關閉</button>
      </div>
    </div>`;
  document.body.appendChild(dlg);
  let pendingFile = null;
  const close = ()=> dlg.remove();
  dlg.addEventListener("click", e=>{ if(e.target===dlg) close(); });
  dlg.querySelector("#bk-close").onclick = close;
  dlg.querySelector("#bk-export").onclick = ()=>{ exportBackup(); };
  dlg.querySelector("#bk-file").onchange = (e)=>{
    pendingFile = e.target.files && e.target.files[0];
    if(!pendingFile) return;
    dlg.querySelector("#bk-file-name").textContent = "已選擇：" + pendingFile.name;
    dlg.querySelector("#bk-mode").style.display = "block";
  };
  dlg.querySelector("#bk-merge").onclick = ()=>{ if(pendingFile){ importBackup(pendingFile, "merge"); close(); } };
  dlg.querySelector("#bk-replace").onclick = ()=>{ if(pendingFile){ importBackup(pendingFile, "replace"); close(); } };
};

renderTabs();
updateProgress();
render();
</script>
